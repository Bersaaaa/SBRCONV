// Cherche, parmi les dépenses existantes, un libellé qui contient une référence
// URSSAF enregistrée — si trouvé, marque la période correspondante comme payée.
function matchReferencesInExpenses(){
  let changed = false;
  DATA.declarations.forEach(decl=>{
    if(!decl.reference || decl.statutPaye) return;
    const ref = decl.reference.toLowerCase();
    const match = activeTx().find(t=>t.type==='depense' && (t.libelle||'').toLowerCase().includes(ref));
    if(match){
      decl.statutPaye = true;
      decl.datePaye = match.date || new Date().toISOString().slice(0,10);
      changed = true;
      cptToast(`✅ Référence "${decl.reference}" trouvée — ${periodLabel(decl.periode)} marquée payée`);
    }
  });
  return changed;
}

/* ================= ROOT IA ================= */
function buildFinancialSummary(){
  const round = n => Math.round(n*100)/100;
  const t = totalsByType();
  const cotisPayees = cotisationsPayeesTotal();
  const s = DATA.settings;
  const recettes = activeTx().filter(x=>x.type==='recette' && !x.cotisationsPrelevees);
  const periods = {};
  recettes.forEach(x=>{ const k=periodKey(x.date); periods[k]=periods[k]||[]; periods[k].push(x); });

  const historiqueCotisations = Object.keys(periods).sort().map(k=>{
    const decl = DATA.declarations.find(d=>d.periode===k);
    const calc = cotisationsDuesFor(periods[k], s);
    let statut = 'à déclarer';
    if(decl && decl.statutPaye) statut = 'payé'; else if(decl && decl.statutDeclare) statut = 'déclaré, pas encore payé';
    return { periode: periodLabel(k), caVente: round(calc.vente), caService: round(calc.service), montantEstime: round(calc.total), statut };
  });
  const cotisEnAttente = historiqueCotisations.filter(h=>h.statut!=='payé');
  const provisionCotisationsEnAttente = round(cotisEnAttente.reduce((a,h)=>a+h.montantEstime,0));

  const depensesParCategorie = {};
  activeTx().filter(x=>x.type==='depense').forEach(x=>{ depensesParCategorie[x.categorie||'Autre'] = round((depensesParCategorie[x.categorie||'Autre']||0) + Math.abs(x.montant)); });

  const moisAvecDepense = new Set(activeTx().filter(x=>x.type==='depense').map(x=>monthKey(x.date)));
  const nbMois = Math.max(1, moisAvecDepense.size);
  const depenseMensuelleMoyenne = round(t.depense / nbMois);
  const fondsDeRoulementSuggere = round(depenseMensuelleMoyenne * 2);

  const tresorerie = round(t.recette + t.apport - t.depense - t.prelevement - cotisPayees);
  const disponibleApresProvision = round(tresorerie - provisionCotisationsEnAttente - fondsDeRoulementSuggere);

  const il30j = new Date(Date.now() - 30*24*3600*1000);
  const remuDerniers30j = round(activeTx().filter(x=>x.type==='prelevement' && new Date(x.date) >= il30j).reduce((a,x)=>a+Math.abs(x.montant),0));

  return {
    totaux: { recettesTotales: round(t.recette), apportsPersonnelsHorsCA: round(t.apport), depensesTotales: round(t.depense), remunerationDejaVersee: round(t.prelevement), remunerationVersee30DerniersJours: remuDerniers30j },
    depensesParCategorie, depenseMensuelleMoyenne,
    cotisations: { dejaPayees: round(cotisPayees), historiquePeriodeParPeriode: historiqueCotisations, provisionRecommandeePourEnAttente: provisionCotisationsEnAttente },
    tresorerieProActuelleEstimee: tresorerie,
    fondsDeRoulementSuggere_2moisDeCharges: fondsDeRoulementSuggere,
    soldeDisponibleApresProvisionsEtFondsDeRoulement: disponibleApresProvision,
    periodicite: s.periodicite, compteBancaireUnique: true
  };
}

  iaLoading = true; iaAnswer=''; renderCompta();

  const prompt = `Voici les données comptables d'un entrepreneur individuel (micro-entreprise, un seul compte bancaire pro) exploitant SBR AUTO (location de véhicules Getaround/Turo/Roadstr + vente de véhicules d'occasion). Données JSON (euros) :

${consigne}
Termine par une phrase précisant que ce sont des estimations basées sur les données saisies, pas un conseil fiscal définitif.`;
  try{

  };

  const c3 = document.createElement('div'); c3.className='card';
  const ruleCard = (r)=>`
    <div class="txrow rule-item" data-search="${esc(((r.motcle||'')+' '+(r.categorie||'')).toLowerCase())}">
      <div class="tx-main">
        <div class="tx-top">

        </div>

          <div><label>Catégorie</label><input type="text" value="${esc(r.categorie)}" onchange="updateRule('${r.id}','categorie',this.value)"></div>
          <div><label>Type</label><select onchange="updateRule('${r.id}','type',this.value)">

            <option value="depense" ${r.type==='depense'?'selected':''}>Dépense</option>
            <option value="prelevement" ${r.type==='prelevement'?'selected':''}>Rémunération</option>
            <option value="apport" ${r.type==='apport'?'selected':''}>Apport personnel</option>
          </select></div>
        </div>
      </div>
    </div>`;
  c3.innerHTML = `
    <button class="acc-head" id="rulesToggle" aria-expanded="${rulesOpen}">
      <span class="acc-chev ${rulesOpen?'open':''}">▶</span>
      <span class="section-title" style="margin:0;flex:1">Règles de catégorisation automatique</span>
      <span class="acc-count">${DATA.rules.length}</span>
    </button>
    <div id="rulesBody" style="display:${rulesOpen?'block':'none'};margin-top:12px">
      <div class="muted" style="font-size:12px;margin-bottom:10px">Dès qu'un libellé contient le mot-clé, l'écriture prend ce type et cette catégorie. Le mot-clé le plus précis l'emporte.</div>
      <div class="row" style="margin-bottom:10px">
        <input type="text" class="searchbar" id="rulesSearch" placeholder="🔍 Chercher une règle…" style="margin-bottom:0">
        <button class="btn btn-ghost" id="addRule" style="flex:0 0 auto;width:auto">+ Ajouter</button>
      </div>
      <button class="btn btn-ghost btn-block" id="addSuggested" style="margin-bottom:10px">✨ Ajouter les règles suggérées manquantes</button>
      <button class="btn btn-ghost btn-block" id="syncSuggested" style="margin-bottom:10px">🔄 Remettre les règles suggérées à jour</button>
      <div class="txlist" id="rulesList"></div>
      <div id="rulesMore"></div>
    </div>`;
  main.appendChild(c3);
  const rulesBody = c3.querySelector('#rulesBody');
  const rulesList = c3.querySelector('#rulesList');
  const rulesMore = c3.querySelector('#rulesMore');
  const rSearch = c3.querySelector('#rulesSearch');
  let limit = 40;
  function paintRules(){
    const q = rSearch.value.trim().toLowerCase();
    const matched = DATA.rules.filter(r=>!q || ((r.motcle||'')+' '+(r.categorie||'')).toLowerCase().includes(q));
    const shown = matched.slice(0, limit);
    rulesList.innerHTML = shown.map(ruleCard).join('') || `<div class="empty">${q?'Aucune règle ne correspond':'Aucune règle'}</div>`;

    rulesMore.innerHTML = reste ? `<button class="btn btn-ghost btn-block" id="moreRules">Afficher les ${reste} suivantes</button>` : '';

  c3.querySelector('#addSuggested').onclick = async ()=>{

    const toAdd = defaultRules().filter(r=>!existing.has(r.motcle.toLowerCase()));
    if(!toAdd.length){ cptToast('Tu as déjà toutes les règles suggérées ✅'); return; }

  };
  c3.querySelector('#syncSuggested').onclick = async ()=>{
    // aligne les règles déjà enregistrées sur les suggestions actuelles (activité,
    // catégorie, type) et ajoute celles qui manquent — les mots-clés que tu as créés
    // toi-même ne sont pas touchés
    const suggested = defaultRules();
    const byMot = new Map(suggested.map(r=>[r.motcle.toLowerCase(), r]));
    let maj = 0;
    DATA.rules.forEach(r=>{
      const ref = byMot.get((r.motcle||'').toLowerCase());
      if(!ref) return;
      if(r.type===ref.type && r.categorie===ref.categorie) return;
      r.type = ref.type; r.categorie = ref.categorie;
      maj++;
    });
    const existing = new Set(DATA.rules.map(r=>(r.motcle||'').toLowerCase()));
    const toAdd = suggested.filter(r=>!existing.has(r.motcle.toLowerCase()));
    DATA.rules.push(...toAdd);
    if(!maj && !toAdd.length){ cptToast('Tes règles sont déjà à jour ✅'); return; }
    rulesOpen = true;
    await saveData();
    cptToast(`${maj} règle(s) mise(s) à jour${toAdd.length?` · ${toAdd.length} ajoutée(s)`:''} ✅`);
    renderCompta();
  };

  const c4 = document.createElement('div'); c4.className='card';
  c4.innerHTML = `<div class="section-title">Données</div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">Les justificatifs sont ${sb&&session?'stockés dans Supabase Storage':'compressés et stockés localement'}.</div>
    <button class="btn btn-accent btn-block" id="exportComptable">📊 Export comptable complet (PDF)</button>
    <button class="btn btn-accent btn-block" id="exportJson">💾 Sauvegarde complète (JSON)</button>
    <label>Restaurer une sauvegarde JSON</label>
    <button type="button" class="btn btn-ghost btn-block" id="importJsonBtn">📂 Choisir un fichier de sauvegarde</button>
    <div class="muted" id="importJsonFileName" style="font-size:11px;margin-top:6px"></div>
    <input type="file" id="importJson" accept="application/json" style="display:none">
    <div class="divider"></div>
    <button class="btn btn-danger btn-block" id="resetAll">Réinitialiser toutes les données</button>`;
  main.appendChild(c4);
  c4.querySelector('#exportComptable').onclick = exportComptablePDF;
  c4.querySelector('#exportJson').onclick = exportJSONBackup;
  c4.querySelector('#importJsonBtn').onclick = ()=> c4.querySelector('#importJson').click();
  c4.querySelector('#importJson').onchange = (e)=>{ if(e.target.files[0]){ c4.querySelector('#importJsonFileName').textContent = '📄 '+e.target.files[0].name; importJSONBackup(e.target.files[0]); } };
  c4.querySelector('#resetAll').onclick = async ()=>{
    if(!confirm('Supprimer définitivement toutes les écritures et déclarations ?')) return;
    DATA = { transactions:[], declarations:[], rules: defaultRules(), lastSyncAt:null, settings: defaultSettings() };
    await saveData(); cptToast('Données réinitialisées'); renderCompta();
  };
}
window.removeRule = async (id)=>{ DATA.rules = DATA.rules.filter(r=>r.id!==id); await saveData(); renderCompta(); };

function exportJSONBackup(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `sbr-compta-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);

}
async function importJSONBackup(file){
  try{
    const parsed = JSON.parse(await file.text());
    if(!parsed || !Array.isArray(parsed.transactions)){ cptToast('⚠️ Fichier invalide'); return; }
    if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
    DATA = Object.assign(DATA, parsed);
    await saveData(); cptToast('Sauvegarde restaurée ✅'); renderCompta();
  }catch(e){ console.error(e); cptToast('⚠️ Impossible de lire ce fichier'); }
}
/* ================= EXPORTS PDF ================= */
const PDF_INK=[16,21,30], PDF_ACCENT=[27,111,184], PDF_GREEN=[26,141,97], PDF_RED=[190,60,55],
      PDF_VIOLET=[104,78,180], PDF_GRAY=[112,124,140], PDF_LINE=[223,227,234], PDF_ZEBRA=[247,249,251];

function pdfEUR(n){
  const v = Math.round((Number(n)||0)*100)/100;
  const parts = Math.abs(v).toFixed(2).split('.');
  const ent = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (v<0?'-':'') + ent + ',' + parts[1] + ' \u20AC';
}
function pdfDate(d){
  if(!d) return '';
  const dt = new Date(d); if(isNaN(dt)) return String(d);
  return String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+dt.getFullYear();
}

/* Fabrique de document : en-tête, sections, cartes de chiffres, tableaux, pieds de page */
function makePdf(subtitle){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const M = 15, W = 210, CW = 180, BOTTOM = 274;
  let y = 0, firstPage = true;

  const now = new Date();
  const stamp = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} à ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  function cover(){
    doc.setFillColor.apply(doc, PDF_INK); doc.rect(0,0,W,34,'F');
    doc.setFillColor.apply(doc, PDF_ACCENT); doc.rect(0,34,W,1.6,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(22);
    doc.text('SBR COMPTA', M, 17);
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(158,178,202);
    doc.text(subtitle, M, 24.5);
    doc.setFontSize(8);
    doc.text(`Édité le ${stamp}`, W-M, 24.5, {align:'right'});
    y = 50;
  }
  function pageHead(){
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor.apply(doc, PDF_GRAY);
    doc.text('SBR COMPTA', M, 12);
    doc.setFont('helvetica','normal');
    doc.text(subtitle, W-M, 12, {align:'right'});
    doc.setDrawColor.apply(doc, PDF_LINE); doc.setLineWidth(0.2); doc.line(M, 15, W-M, 15);
    y = 25;
  }
  function newPage(){ doc.addPage(); pageHead(); }
  function ensure(need){ if(y + need > BOTTOM) newPage(); }

  function section(title){
    ensure(18);
    doc.setFillColor.apply(doc, PDF_ACCENT); doc.rect(M, y-3.4, 2.2, 4.6, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(11.5); doc.setTextColor.apply(doc, PDF_INK);
    doc.text(title, M+5, y);
    doc.setDrawColor.apply(doc, PDF_LINE); doc.setLineWidth(0.3); doc.line(M, y+3.2, W-M, y+3.2);
    y += 11;
  }
  function kpis(items){
    const per = 3, gap = 3.5;
    for(let start=0; start<items.length; start+=per){
      const slice = items.slice(start, start+per);
      ensure(24);
      const w = (CW - gap*(per-1)) / per;
      slice.forEach((it,i)=>{
        const x = M + i*(w+gap);
        doc.setDrawColor.apply(doc, PDF_LINE); doc.setLineWidth(0.3);
        doc.setFillColor(252,253,254);
        doc.roundedRect(x, y, w, 19, 1.5, 1.5, 'FD');
        doc.setFillColor.apply(doc, it.color); doc.rect(x, y, 1.4, 19, 'F');
        doc.setFont('helvetica','bold'); doc.setFontSize(6.6); doc.setTextColor.apply(doc, PDF_GRAY);
        doc.text(it.label.toUpperCase(), x+5, y+6, {maxWidth: w-8});
        doc.setFontSize(12.5); doc.setTextColor.apply(doc, it.color);
        doc.text(it.value, x+5, y+14, {maxWidth: w-8});
      });
      y += 19 + gap;
    }
    y += 3;
  }
  function note(text){
    ensure(10);
    doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor.apply(doc, PDF_GRAY);
    doc.text(text, M, y); y += 9;
    doc.setFont('helvetica','normal'); doc.setTextColor.apply(doc, PDF_INK);
  }
  /* cols : [{label, w, align, color}] — rows : tableau de tableaux de chaînes */
  function table(cols, rows, opts){
    opts = opts || {};
    const RH = 6.6;
    function headRow(){
      ensure(RH+4);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.2); doc.setTextColor.apply(doc, PDF_GRAY);
      let x = M;
      cols.forEach(c=>{
        doc.text(c.label.toUpperCase(), c.align==='right' ? x+c.w-2 : x+2, y, c.align==='right'?{align:'right'}:{});
        x += c.w;
      });
      doc.setDrawColor.apply(doc, PDF_INK); doc.setLineWidth(0.35); doc.line(M, y+2, W-M, y+2);
      y += RH;
    }
    headRow();
    doc.setFont('helvetica','normal'); doc.setFontSize(8.6);
    rows.forEach((r,ri)=>{
      if(y + RH > BOTTOM){ newPage(); headRow(); doc.setFont('helvetica','normal'); doc.setFontSize(8.6); }
      if(ri%2===1){ doc.setFillColor.apply(doc, PDF_ZEBRA); doc.rect(M, y-4.2, CW, RH, 'F'); }
      let x = M;
      r.forEach((cell,i)=>{
        const c = cols[i];
        doc.setTextColor.apply(doc, c.color || PDF_INK);
        const txt = doc.splitTextToSize(String(cell==null?'':cell), c.w-4)[0] || '';
        doc.text(txt, c.align==='right' ? x+c.w-2 : x+2, y, c.align==='right'?{align:'right'}:{});
        x += c.w;
      });
      doc.setDrawColor.apply(doc, PDF_LINE); doc.setLineWidth(0.15); doc.line(M, y+2.4, W-M, y+2.4);
      y += RH;
    });
    if(opts.total){
      ensure(10);
      doc.setDrawColor.apply(doc, PDF_INK); doc.setLineWidth(0.35); doc.line(M, y-1.4, W-M, y-1.4);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor.apply(doc, PDF_INK);
      doc.text(opts.total.label, M+2, y+4.5);
      doc.setTextColor.apply(doc, opts.total.color || PDF_INK);
      doc.text(opts.total.value, W-M-2, y+4.5, {align:'right'});
      y += 11;
    }
    y += 6;
  }
  function finish(filename, mention){
    const pages = doc.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){
      doc.setPage(i);
      doc.setDrawColor.apply(doc, PDF_LINE); doc.setLineWidth(0.2); doc.line(M, 283, W-M, 283);
      doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor.apply(doc, PDF_GRAY);
      doc.text(mention, M, 288, {maxWidth: CW-20});
      doc.text(`${i}/${pages}`, W-M, 288, {align:'right'});
    }
    deliverPdf(doc, filename, subtitle);
  }

  cover();
  return { doc, section, kpis, table, note, ensure, finish, M, W, CW, get y(){return y;}, set y(v){y=v;} };
}

/* Ouvre la feuille de partage du téléphone (AirDrop, Messages, WhatsApp, Enregistrer
   dans Fichiers…) ; à défaut, affiche le PDF dans la visionneuse intégrée. */
async function deliverPdf(doc, filename, title){
  let blob;
  try{ blob = doc.output('blob'); }
  catch(e){ console.error(e); cptToast('⚠️ Impossible de générer le PDF'); return; }

  const file = makePdfFile(blob, filename);
  if(await sharePdfFile(file, title)) return;

  const url = URL.createObjectURL(blob);
  openDocViewer({url, isPdf:true, title: title||filename, revoke:true, filename, shareFile:file, shareTitle:title});
}
function makePdfFile(blob, filename){
  try{ return new File([blob], filename, {type:'application/pdf'}); }
  catch(e){ return null; }
}
async function sharePdfFile(file, title){
  if(!file || !navigator.share || !navigator.canShare || !navigator.canShare({files:[file]})) return false;
  try{
    await navigator.share({files:[file], title: title||file.name});
    return true;
  }catch(e){
    if(e && e.name === 'AbortError') return true; // partage annulé par l'utilisateur
    console.error(e);
    return false;
  }
}

function exportSalairePDF(list, total){

      {label:'Du', value: pdfDate(first.date), color: PDF_INK},

      {label:'Total versé', value: pdfEUR(total), color: PDF_VIOLET},

    P.table(
      [{label:'Date', w:26}, {label:'Libellé', w:114}, {label:'Montant', w:40, align:'right'}],

      rec.map(x=>[pdfDate(x.date), x.libelle||'', x.categorie||'', pdfEUR(x.montant)]),
      {total:{label:'Total des recettes', value: pdfEUR(t.recette), color: PDF_GREEN}}
    ); else P.note('Aucune recette enregistrée.');

    P.section('Livre de dépenses');
    const dep = activeTx().filter(x=>x.type==='depense').sort((a,b)=>a.date.localeCompare(b.date));
    if(dep.length) P.table(
      [{label:'Date', w:26}, {label:'Libellé', w:96}, {label:'Catégorie', w:44}, {label:'Montant', w:30, align:'right', color:PDF_RED}],
      dep.map(x=>[pdfDate(x.date), x.libelle||'', x.categorie||'', pdfEUR(Math.abs(x.montant))]),
      {total:{label:'Total des dépenses', value: pdfEUR(t.depense), color: PDF_RED}}
    ); else P.note('Aucune dépense enregistrée.');

    P.section('Rémunération versée');
    const rem = activeTx().filter(x=>x.type==='prelevement').sort((a,b)=>a.date.localeCompare(b.date));
    if(rem.length) P.table(
      [{label:'Date', w:24}, {label:'Libellé', w:116}, {label:'Montant', w:40, align:'right', color:PDF_VIOLET}],
      rem.map(x=>[pdfDate(x.date), x.libelle||'', pdfEUR(Math.abs(x.montant))]),
      {total:{label:'Total versé', value: pdfEUR(t.prelevement), color: PDF_VIOLET}}
    ); else P.note('Aucun virement enregistré.');

    P.section('Apports personnels (hors CA, non déclarés URSSAF)');
    const app = activeTx().filter(x=>x.type==='apport').sort((a,b)=>a.date.localeCompare(b.date));
    if(app.length) P.table(
      [{label:'Date', w:24}, {label:'Libellé', w:116}, {label:'Montant', w:40, align:'right', color:PDF_VIOLET}],
      app.map(x=>[pdfDate(x.date), x.libelle||'', pdfEUR(Math.abs(x.montant))]),
      {total:{label:'Total des apports', value: pdfEUR(t.apport), color: PDF_VIOLET}}
    ); else P.note('Aucun apport personnel enregistré.');

    P.section('Suivi URSSAF par période');
    const s = DATA.settings;
    const recettesDecl = activeTx().filter(x=>x.type==='recette' && !x.cotisationsPrelevees);
    const periods = {};
    recettesDecl.forEach(x=>{ const k=periodKey(x.date); periods[k]=periods[k]||[]; periods[k].push(x); });
    const urssafRows = Object.keys(periods).sort().map(k=>{
      const calc = cotisationsDuesFor(periods[k], s);
      const decl = DATA.declarations.find(d=>d.periode===k);
      const statut = decl && decl.statutPaye ? 'Payé' : decl && decl.statutDeclare ? 'Déclaré' : 'À déclarer';
      return [periodLabel(k), pdfEUR(calc.vente+calc.service), pdfEUR(calc.total), pdfDate(urssafDeadline(k)), statut];
    });
    if(urssafRows.length) P.table(
      [{label:'Période', w:32}, {label:'CA encaissé', w:38, align:'right'}, {label:'Cotisations estimées', w:42, align:'right'},
       {label:'Échéance', w:32}, {label:'Statut', w:36}],
      urssafRows
    ); else P.note('Aucune période à déclarer.');

    P.finish(`sbr-compta-export-comptable-${new Date().toISOString().slice(0,10)}.pdf`,
      'Généré par SBR COMPTA à partir des données saisies. Estimations à vérifier avant transmission (déclarations, banque, etc.).');
  }catch(e){ console.error(e); cptToast('⚠️ Impossible de générer le PDF'); }
}

/* ================= PWA ================= */
function setupPWA(){
  try{
    const manifest = {
      name: "SBR COMPTA", short_name: "SBR COMPTA", start_url: ".", display: "standalone",
      background_color: "#0a0d13", theme_color: "#0a0d13",
      icons: [
        { src: "/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: "/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e)=>{ e.preventDefault(); deferredPrompt = e; const btn = document.getElementById('installBtn'); if(btn) btn.style.display = 'inline-block'; });
    const btn = document.getElementById('installBtn');
    if(btn) btn.onclick = async ()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; btn.style.display = 'none'; };
  }catch(e){ console.error('PWA setup failed', e); }
}

/* ================= BOOT (intégré à SBR AUTO) =================
   Appelée une fois depuis boot() de SBR AUTO, juste après loadProfile().
   Réutilise la session déjà ouverte (un seul compte pour Location + Compta). */
let comptaBooted = false;
async function initCompta(){
  if(comptaBooted) return;
  comptaBooted = true;
  purgeCorbeille();
  session = (state.profile && state.profile.id) ? { user: { id: state.profile.id, email: state.profile.email } } : null;
  await loadData();
  if(sb && session){ await pullFromCloud(); }
  if(matchReferencesInExpenses()) await saveData();
  const tb = document.getElementById('comptaTrashBtn');
  if(tb) tb.onclick = ()=>{ current='corbeille'; renderCompta(); };
  if(sb && session){ setupNotifications(); }
}

</script>
