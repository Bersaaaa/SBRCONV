function fmtKmPdf(n){
  n = isNaN(n) ? 0 : Math.round(Number(n));
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
function fmtEURPdf(n){
  n = isNaN(n) ? 0 : Number(n);
  const neg = n < 0; n = Math.abs(n);
  const s = n.toFixed(2).replace('.', ',');
  const parts = s.split(',');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg?'-':'') + parts.join(',') + ' €';
}
/* Partage natif pour les PDF (menu "Partager" iOS/Android : Mail, WhatsApp,
   Fichiers...) si le navigateur le permet, sinon repli sur le téléchargement. */
/* Vrai partage (feuille de partage native) uniquement sur mobile — sur PC/Mac
   de bureau, on force toujours le téléchargement direct du PDF, même quand le
   navigateur (Windows/Edge/Chrome) propose techniquement navigator.share. */
const IS_MOBILE_DEVICE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
async function shareOrSavePDF(doc, filename){
  try{
    if(IS_MOBILE_DEVICE && navigator.share && navigator.canShare){
      const blob = doc.output('blob');
      const file = new File([blob], filename, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        // Important : ne JAMAIS ajouter "title" (ni "text") ici en plus de
        // "files". Sur iOS, certaines cibles du menu de partage (dont
        // "Enregistrer dans Fichiers") traitent ce texte comme un second
        // élément à partager et créent un fichier .txt parasite séparé
        // (nommé "texte X.txt") contenant ce titre, en plus du vrai PDF.
        await navigator.share({files:[file]});
        return;
      }
    }
  }catch(e){
    if(e.name==='AbortError') return;
  }
  doc.save(filename);
}
/* ============================= RENTABILITÉ PAR VÉHICULE =============================
   Tout est saisi à la main : pour chaque véhicule et chaque mois, ce qui a été
   gagné (par plateforme), le détail des dépenses et la décote du mois. Rien
   n'est calculé à partir d'un autre registre — ce module sert uniquement à
   voir où en est la rentabilité de chaque véhicule. */
const RENTA_REVENUS = [
  {key:'rev_getaround', label:'Getaround'},
  {key:'rev_turo',      label:'Turo'},
  {key:'rev_roadstr',   label:'Roadstr'},
  {key:'rev_vente',     label:'Vente du véhicule'},
  {key:'rev_autres',    label:'Autres gains'}
];
const RENTA_DEPENSES = [
  {key:'dep_assurance',  label:'Assurance'},
  {key:'dep_credit',     label:'Crédit / loyer'},
  {key:'dep_entretien',  label:'Entretien / révision'},
  {key:'dep_reparation', label:'Réparation / carrosserie'},
  {key:'dep_pneus',      label:'Pneus'},
  {key:'dep_carburant',  label:'Carburant / péage'},
  {key:'dep_nettoyage',  label:'Nettoyage'},
  {key:'dep_amendes',    label:'Amendes'},
  {key:'dep_parking',    label:'Parking / stationnement'},
  {key:'dep_autres',     label:'Autres dépenses'}
];

let rentaSelectedVehicle = null;
let rentaOpenMonth = null;      // index du mois déplié dans le détail (0-11)

function activeRenta(){ return (state.renta_lignes||[]).filter(r=>!r.deleted_at); }
function rentaRow(vehicleId, year, mois){
  return activeRenta().find(r => r.vehicle_id===vehicleId && Number(r.annee)===Number(year) && Number(r.mois)===Number(mois)) || null;
}
function rentaTotaux(row){
  const gains    = RENTA_REVENUS.reduce((s,f)=>s+Number((row&&row[f.key])||0),0);
  const depenses = RENTA_DEPENSES.reduce((s,f)=>s+Number((row&&row[f.key])||0),0);
  const decote   = Number((row&&row.decote)||0);
  return { gains, depenses, decote, marge: gains-depenses-decote, rempli: !!row };
}
/* Taux d'occupation lu automatiquement dans le Planning Véhicules (jours
   loués : Getaround, Turo, Roadstr ou location directe). */
function rentaOccupationMois(vehicleId, year, mois){
  const nd = daysInMonth(year, mois);
  const mk = `${year}-${pad2(mois+1)}`;
  const monthData = (state.planningVehicules[vehicleId]||{})[mk] || {};
  let occ = 0;
  for(let d=1; d<=nd; d++){ const s = monthData[d]; if(s==='GA'||s==='Turo'||s==='Roadstr') occ++; }
  const now = new Date();
  const commence = year < now.getFullYear() || (year===now.getFullYear() && mois<=now.getMonth());
  return { occDays:occ, totalDaysMonth:nd, occupation: commence ? (occ/nd*100) : null };
}
function vehicleRentaYear(vehicleId, year){
  const perMonth = MONTHS.map((m,i)=>{
    const row = rentaRow(vehicleId, year, i);
    return { mois:m, idx:i, row, ...rentaTotaux(row), ...rentaOccupationMois(vehicleId, year, i) };
  });
  const gains    = perMonth.reduce((s,m)=>s+m.gains,0);
  const depenses = perMonth.reduce((s,m)=>s+m.depenses,0);
  const decote   = perMonth.reduce((s,m)=>s+m.decote,0);
  const moisRemplis = perMonth.filter(m=>m.rempli).length;
  const commences = perMonth.filter(m=>m.occupation!=null);
  const occupied = commences.reduce((s,m)=>s+m.occDays,0);
  const totalDays = commences.reduce((s,m)=>s+m.totalDaysMonth,0);
  return {
    perMonth, gains, depenses, decote, marge: gains-depenses-decote, moisRemplis,
    tauxOccupation: totalDays>0 ? (occupied/totalDays*100) : 0,
    margeMoyenne: moisRemplis>0 ? (gains-depenses-decote)/moisRemplis : 0
  };
}
/* Création à la volée de la ligne du mois dès la première saisie. Le petit
   verrou `rentaPending` évite de créer deux lignes si plusieurs champs du
   même mois sont remplis coup sur coup. */
let rentaPending = {};
async function ensureRentaRow(vehicleId, year, mois){
  const existing = rentaRow(vehicleId, year, mois);
  if(existing) return existing;
  const k = `${vehicleId}|${year}|${mois}`;
  if(!rentaPending[k]){
    rentaPending[k] = (async () => {
      const created = await createRow('renta_lignes', { vehicle_id:vehicleId, annee:Number(year), mois:Number(mois) });
      delete rentaPending[k];
      return created;
    })();
  }
  return await rentaPending[k];
}
async function editRenta(vehicleId, year, mois, key, val){
  const row = await ensureRentaRow(vehicleId, year, mois);
  if(!row) return;
  editItem('renta_lignes', row.id, key, val);
}
async function resetRentaMois(vehicleId, year, mois){
  const row = rentaRow(vehicleId, year, mois);
  if(!row) return;
  if(!(await iosConfirm({message:`Effacer toutes les données de ${MONTHS[mois]} ${year} pour ce véhicule ?`, confirmLabel:'Effacer'}))) return;
  softDeleteItem('renta_lignes', row.id, null, true);
}

const PLANNING_VEH_STATUTS = {
  'GA':      { label:'Getaround',       cls:'ga',       txt:'GA' },
  'Turo':    { label:'Turo',            cls:'turo',     txt:'TU' },
  'Roadstr': { label:'Roadstr',         cls:'roadstr',  txt:'RD' },
  'Sinistre':{ label:'Sinistre',        cls:'sinistre', txt:'SI' }
};
function planningVehInfo(val){ return PLANNING_VEH_STATUTS[val] || { label:'Libre', cls:'', txt:'' }; }
const RESA_PLATFORMS = ['GA','Turo','Roadstr'];
async function cyclePlanningVeh(vid, year, month, day){
  const mk = `${year}-${pad2(month+1)}`;
  const ds = dateStr(year, month, day);
  const cur = (state.planningVehicules[vid] && state.planningVehicules[vid][mk] && state.planningVehicules[vid][mk][day]) || '';
  const order = ['', 'GA', 'Turo', 'Roadstr', 'Sinistre'];
  const i = order.indexOf(cur);
  const next = order[(i>=0 ? i+1 : 1) % order.length];
  // Anti-chevauchement : si le jour était déjà occupé par une autre plateforme,
  // on prévient avant d'écraser l'info (le planning n'est pas synchronisé
  // automatiquement avec Getaround/Turo/Roadstr, donc c'est la seule protection).
  if(cur && next && cur !== next){
    const okOverwrite = await iosConfirm({
      title: 'Écraser ce jour ?',
      message: `Ce jour est déjà marqué "${planningVehInfo(cur).label}".\nLe remplacer par "${planningVehInfo(next).label}" ?\n\nVérifie qu'il n'y a pas de réservation en cours sur ${planningVehInfo(cur).label} avant de confirmer.`,
      confirmLabel: 'Remplacer', destructive: true
    });
    if(!okOverwrite) return;
  }
  // Blocage obligatoire : comme il n'existe pas de synchro automatique entre
  // Getaround, Turo et Roadstr, on ne considère le jour comme réservé
  // qu'une fois que l'utilisateur a confirmé avoir bloqué la date ailleurs.
  if(RESA_PLATFORMS.includes(next)){
    const autres = RESA_PLATFORMS.filter(p=>p!==next).map(p=>planningVehInfo(p).label);
    const confirmed = await iosConfirm({
      title: 'Bloque les autres plateformes',
      message: `${planningVehInfo(next).label} noté pour le ${day}.\n\nAs-tu bien bloqué cette date sur ${autres.join(' et ')} directement dans leurs applis ?`,
      confirmLabel: "Oui, c'est fait", cancelLabel: 'Pas encore', destructive: false
    });
    if(!confirmed) return;
  }
  if(!state.planningVehicules[vid]) state.planningVehicules[vid] = {};
  if(!state.planningVehicules[vid][mk]) state.planningVehicules[vid][mk] = {};
  state.planningVehicules[vid][mk][day] = next;
  render();
  const vLabel = (() => { const v = state.vehicles.find(x=>x.id===vid); return v ? `${v.nom||'Véhicule'} (${v.immat||'—'})` : 'Véhicule'; })();
  if(next===''){
    queueWrite({ run: () => sb.from('planning_vehicules').delete().eq('vehicle_id', vid).eq('day', ds) });
  } else {
    queueWrite({
      run: () => sb.from('planning_vehicules').upsert({ vehicle_id: vid, day: ds, statut: next }, { onConflict: 'vehicle_id,day' }),
      onSuccess: () => sendPush(
        next==='Sinistre' ? `💥 Sinistre — ${vLabel}` : `📅 Planning mis à jour — ${vLabel}`,
        `${planningVehInfo(next).label} — ${day}`
      )
    });
  }
}

async function applyRangeVeh(){
  const vid = document.getElementById('rangeVehId').value;
  const from = parseInt(document.getElementById('rangeVehFrom').value,10);
  const to = parseInt(document.getElementById('rangeVehTo').value,10);
  const statut = document.getElementById('rangeVehStatut').value;
  const {month, year} = state.ui;
  if(!vid){ toast('Sélectionne un véhicule.', true); return; }
  if(isNaN(from) || isNaN(to) || from<1 || to<1){ toast('Indique un jour de début et de fin.', true); return; }
  const start = Math.min(from,to), end = Math.max(from,to);
  const nd = daysInMonth(year, month);
  if(end > nd){ toast(`Ce mois n'a que ${nd} jours.`, true); return; }

  const mk = `${year}-${pad2(month+1)}`;
  const days = [];
  for(let d=start; d<=end; d++) days.push(d);

  // Anti-chevauchement : on liste les jours déjà occupés par une AUTRE
  // plateforme dans la période choisie, et on demande confirmation avant
  // d'écraser quoi que ce soit.
  const monthPlan = (state.planningVehicules[vid]||{})[mk] || {};
  const conflits = days.filter(d => monthPlan[d] && monthPlan[d] !== statut);
  if(conflits.length){
    const detail = conflits.map(d => `${d} (${planningVehInfo(monthPlan[d]).label})`).join(', ');
    const okOverwrite = await iosConfirm({
      title: 'Écraser ces jours ?',
      message: `Ces jours sont déjà occupés par une autre plateforme : ${detail}.\n\nLes remplacer par "${planningVehInfo(statut).label || 'Libre'}" ?\nVérifie qu'il n'y a pas de réservation en cours avant de confirmer.`,
      confirmLabel: 'Remplacer', destructive: true
    });
    if(!okOverwrite) return;
  }

  // Blocage obligatoire : comme il n'existe pas de synchro automatique entre
  // Getaround, Turo et Roadstr, on ne considère la période comme réservée
  // qu'une fois que l'utilisateur a confirmé avoir bloqué les dates ailleurs.
  if(RESA_PLATFORMS.includes(statut)){
    const autres = RESA_PLATFORMS.filter(p=>p!==statut).map(p=>planningVehInfo(p).label);
    const periode = start===end ? `le ${start}` : `du ${start} au ${end}`;
    const confirmed = await iosConfirm({
      title: 'Bloque les autres plateformes',
      message: `${planningVehInfo(statut).label} noté ${periode}.\n\nAs-tu bien bloqué cette période sur ${autres.join(' et ')} directement dans leurs applis ?`,
      confirmLabel: "Oui, c'est fait", cancelLabel: 'Pas encore', destructive: false
    });
    if(!confirmed) return;
  }

  if(!state.planningVehicules[vid]) state.planningVehicules[vid] = {};
  if(!state.planningVehicules[vid][mk]) state.planningVehicules[vid][mk] = {};
  days.forEach(d=>{ state.planningVehicules[vid][mk][d] = statut; });
  render();

  try{
    if(statut===''){
      const { error } = await sb.from('planning_vehicules').delete().eq('vehicle_id', vid).in('day', days.map(d=>dateStr(year,month,d)));
      if(error) toast('Erreur planning: '+error.message, true);
    } else {
      const rows = days.map(d=>({ vehicle_id: vid, day: dateStr(year,month,d), statut }));
      const { error } = await sb.from('planning_vehicules').upsert(rows, { onConflict: 'vehicle_id,day' });
      if(error) toast('Erreur planning: '+error.message, true);
    }
  }catch(e){ toast('Erreur planning: '+e.message, true); }
}

function daysBetweenDates(a,b){ return Math.round((a - b) / 86400000); }
function ctStatus(v){
  if(!v.prochainCT) return {label:'—', cls:'info'};
  const d = new Date(v.prochainCT), now = new Date();
  const j = daysBetweenDates(d, now);
  if(j < 0) return {label:`🚨 DÉPASSÉ ${Math.abs(j)}j`, cls:'bad'};
  if(j <= 30) return {label:`⚠️ dans ${j}j`, cls:'warn'};
  return {label:`✅ OK — ${j}j`, cls:'ok'};
}
function assStatus(v){
  if(!v.prochaineAssurance) return {label:'—', cls:'info'};
  const d = new Date(v.prochaineAssurance), now = new Date();
  const j = daysBetweenDates(d, now);
  if(j < 0) return {label:'❌ Expirée', cls:'bad'};
  if(j <= 30) return {label:`⚠️ dans ${j}j`, cls:'warn'};
  return {label:'✅ Active', cls:'ok'};
}

function exportCarnetPDF(vehicleId){
  try{
    if(!window.jspdf || !window.jspdf.jsPDF){
      toast('La librairie PDF n\'a pas pu se charger (vérifie ta connexion internet) — réessaie dans quelques secondes.', true);
      return;
    }
    const v = state.vehicles.find(v=>v.id===vehicleId);
    if(!v){ toast('Sélectionne un véhicule à exporter.', true); return; }
    const entries = activeEntretiens().filter(e=>e.vehicle_id===vehicleId).sort((a,b)=> new Date(a.date||0) - new Date(b.date||0));
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    try{ doc.addImage(LOGO_DATA_URI, 'PNG', 14, 10, 16, 16); }catch(e){}
    doc.setFontSize(15);
    doc.setTextColor(20,20,20);
    doc.text(`Carnet d'entretien — ${v.nom||'Véhicule'}`, 34, 18);
    doc.setFontSize(9);
    doc.setTextColor(120,120,120);
    doc.text(`Immatriculation ${v.immat||''}`, 34, 24);
    doc.text('Généré le ' + new Date().toLocaleDateString('fr-FR') + ' — SBR AUTO', 34, 29);

    let y = 42;
    doc.setFontSize(11);
    doc.setTextColor(20,20,20);
    doc.setFont(undefined, 'bold');
    doc.text('Fiche véhicule', 14, y);
    y += 7;

    const info = [
      ['Immatriculation', v.immat || '-'],
      ['Année', v.annee ? String(v.annee) : '-'],
      ['Énergie', v.energie || '-'],
      [`Crit'Air`, v.critair || '-'],
      ['Kilométrage actuel', v.km!=null ? `${fmtKmPdf(v.km)} km` : '-'],
      ['Statut', v.statut || '-']
    ];
    const panelH = Math.ceil(info.length/2)*7 + 6;
    doc.setFillColor(248,249,251);
    doc.setDrawColor(226,229,234);
    doc.setLineWidth(0.3);
    doc.roundedRect(14, y-4, 182, panelH, 2, 2, 'FD');

    doc.setFont(undefined, 'normal');
    doc.setFontSize(9);
    info.forEach(([label,val], i)=>{
      const col = i % 2;
      const rowI = Math.floor(i/2);
      const x = 19 + col*91;
      const ly = y + 2 + rowI*7;
      doc.setTextColor(125,125,125);
      doc.text(label, x, ly);
      doc.setTextColor(20,20,20);
      doc.setFont(undefined, 'bold');
      doc.text(String(val), x + 48, ly);
      doc.setFont(undefined, 'normal');
    });
    y += panelH + 6;

    doc.setFontSize(11);
    doc.setTextColor(20,20,20);
    doc.setFont(undefined, 'bold');
    doc.text(`Historique des entretiens (${entries.length})`, 14, y);
    y += 9;

    if(entries.length===0){
      doc.setFont(undefined, 'normal');
      doc.setFontSize(9.5);
      doc.setTextColor(120,120,120);
      doc.text('Aucun entretien enregistré pour ce véhicule.', 16, y);
      y += 8;
    } else {
      entries.forEach((e)=>{
        const typeLabel = (e.type==='Autre' && e.type_detail) ? `Autre : ${e.type_detail}` : (e.type||'Entretien');
        const titleLines = doc.splitTextToSize(typeLabel, 120);
        const blockH = 15 + (titleLines.length-1)*5.5;

        if(y + blockH > 272){ doc.addPage(); y = 20; }

        // cadre de la fiche
        doc.setFillColor(248,249,251);
        doc.setDrawColor(226,229,234);
        doc.setLineWidth(0.3);
        doc.roundedRect(14, y-5, 182, blockH, 2, 2, 'FD');
        // barre de couleur à gauche
        doc.setFillColor(68,87,230);
        doc.rect(14, y-5, 1.6, blockH, 'F');

        // titre = type d'entretien
        doc.setFont(undefined, 'bold');
        doc.setFontSize(10.5);
        doc.setTextColor(20,20,20);
        doc.text(titleLines, 19, y);
        // date alignée à droite
        doc.setFont(undefined, 'normal');
        doc.setFontSize(9.5);
        doc.setTextColor(90,90,90);
        doc.text(fmtDate(e.date), 192, y, { align:'right' });

        // ligne de détails
        let dy = y + 5.5 + (titleLines.length-1)*5.5;
        doc.setFontSize(9);
        doc.setTextColor(110,110,110);
        const details = [
          `Garage : ${e.garage || 'non renseigné'}`,
          `Km réalisé : ${fmtKmPdf(e.km_realise)} km`,
          `Prochain : ${fmtKmPdf(e.prochain_km)} km`
        ].join('     ·     ');
        doc.text(doc.splitTextToSize(details, 175), 19, dy);

        y += blockH + 4;
      });
    }

    const pageCount = doc.internal.getNumberOfPages();
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    for(let i=1;i<=pageCount;i++){
      doc.setPage(i);
      try{ doc.addImage(LOGO_DATA_URI, 'PNG', 14, pageH-18, 9, 9); }catch(e){}
      doc.setFontSize(8);
      doc.setTextColor(150,150,150);
      doc.setFont(undefined, 'normal');
      doc.text('SBR AUTO', 26, pageH-12);
      doc.text(`Page ${i}/${pageCount}`, pageW-14, pageH-12, { align:'right' });
    }

    shareOrSavePDF(doc, `SBRAUTO_carnet_entretien_${(v.immat||'vehicule').replace(/[^A-Za-z0-9]/g,'')}.pdf`);
  }catch(e){
    toast('Erreur génération PDF: '+e.message, true);
  }
}

        </div>
        <button class="ios-sheet-btn" data-act="gen" style="font-weight:700;color:var(--primary);">🖨️ Générer le PDF (signature automatique)</button>
      </div>
      <button class="ios-sheet-btn ios-sheet-cancel" data-act="cancel">Annuler</button>
    </div>`;
  document.body.appendChild(backdrop);
  requestAnimationFrame(() => requestAnimationFrame(() => backdrop.classList.add('show')));
  function close(){ backdrop.classList.remove('show'); setTimeout(() => backdrop.remove(), 280); }

function pdfAddWrapped(doc, text, x, y, maxWidth, lineHeight){
  const lines = doc.splitTextToSize(text, maxWidth);
  lines.forEach(line => {
    if(y > 280){ doc.addPage(); y = 20; }
    doc.text(line, x, y);
    y += lineHeight;
  });
  return y;
}

async function addEntretien(){

  const row = { vehicle_id: target.id, type:'Vidange', date: todayISO(), km_realise: target.km||0, prochain_km: (target.km||0) + 15000 };
  carnetSort = 'date_desc'; carnetOpen = true;   // le nouvel entretien remonte en haut

function deleteEntretien(id){ softDeleteItem('entretiens', id, 'Mettre cet entretien à la corbeille ?'); }
async function duplicateEntretien(id){
  const src = state.entretiens.find(e=>e.id===id);
  if(!src) return;
  const row = { vehicle_id:src.vehicle_id, type:src.type, type_detail:src.type_detail, garage:src.garage, date: todayISO(), km_realise:src.km_realise, prochain_km:src.prochain_km };
  try{
    const { data, error } = await sb.from('entretiens').insert(row).select().single();
    if(error) return toast('Erreur duplication: '+error.message, true);
    state.entretiens.push(data); carnetSort='date_desc'; carnetOpen=true; render(); focusNewRow(data.id);
  }catch(e){ toast('Erreur duplication: '+e.message, true); }
}
function changeEntretienVehicle(id, vehicleId){
  const row = state.entretiens.find(e=>e.id===id);

  const km = v.km || 0;

}

function editVehicule(id,key,val){
  const v = state.vehicles.find(v=>v.id===id);
  if(!v) return;
  if(key==='immat'){
    const clean = (val||'').trim();
    if(clean){
      const dup = activeVehicles().find(o=>o.id!==id && (o.immat||'').trim().toLowerCase()===clean.toLowerCase());
      if(dup){
        toast(`L'immatriculation "${clean}" est déjà utilisée par "${dup.nom||'un autre véhicule'}". Deux véhicules ne peuvent pas avoir la même plaque (ça fausserait les calculs de rentabilité).`, true);
        render();
        return;
      }
    }
  }
  v[key] = val;
  const payload = {};
  const dbKey = vehKeyToDb(key);
  payload[dbKey] = val===''?null:val;
  if(key==='km'){
    const now = new Date().toISOString();
    v.kmUpdatedAt = now;
    payload.km_updated_at = now;
  }
  render();
  queueWrite({ run: () => sb.from('vehicles').update(payload).eq('id', id) });
}
function vehicleHasFutureBookings(vehicleId){
  const plan = state.planningVehicules[vehicleId];
  if(!plan) return false;
  const now = new Date();
  const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const todayDay = now.getDate();
  for(const mk in plan){
    const days = plan[mk];
    for(const d in days){
      const status = days[d];
      if(!status || status==='Libre') continue;
      if(mk > todayKey || (mk === todayKey && Number(d) >= todayDay)) return true;
    }
  }
  return false;
}
async function deleteVehicule(id){
  if(vehicleHasFutureBookings(id)){
    const proceed = await iosConfirm({
      title: 'Réservations en cours',
      message: 'Ce véhicule a des réservations planifiées aujourd\'hui ou plus tard (Getaround/Turo). Le mettre à la corbeille les masquera aussi. Continuer ?',
      confirmLabel: 'Continuer quand même'
    });
    if(!proceed) return;
    softDeleteItem('vehicles', id, null, true);
  } else {
    softDeleteItem('vehicles', id, 'Mettre ce véhicule à la corbeille ?');
  }
}
async function uploadVehicleDoc(vehicleId, field, file){
  if(!file) return;
  const path = `vehicles/${vehicleId}/${field}/${Date.now()}_${file.name}`.replace(/\s+/g,'_');
  try{
    const { error: upErr } = await sb.storage.from('justificatifs').upload(path, file, { upsert:true });
    if(upErr) return toast('Erreur upload (le bucket "justificatifs" a-t-il été créé via schema_update_v2.sql ?): '+upErr.message, true);
    const { error } = await sb.from('vehicles').update({ [field]: path }).eq('id', vehicleId);
    if(error) return toast('Erreur sauvegarde: '+error.message, true);
    const v = state.vehicles.find(v=>v.id===vehicleId);
    if(v) v[field] = path;
    render();
  }catch(e){ toast('Erreur upload: '+e.message, true); }
}
async function viewVehicleDoc(vehicleId, field){
  const v = state.vehicles.find(v=>v.id===vehicleId);
  const path = v && v[field];
  if(!path) return;
  try{
    const { data, error } = await sb.storage.from('justificatifs').createSignedUrl(path, 3600);
    if(error) return toast('Erreur ouverture: '+error.message, true);
    window.open(data.signedUrl, '_blank');
  }catch(e){ toast('Erreur ouverture: '+e.message, true); }
}
async function removeVehicleDoc(vehicleId, field){
  if(!(await iosConfirm({message:'Retirer ce document ?', confirmLabel:'Retirer'}))) return;
  const v = state.vehicles.find(v=>v.id===vehicleId);
  if(!v) return;
  const path = v[field];
  v[field] = null; render();
  try{
    if(path) await sb.storage.from('justificatifs').remove([path]);
    const { error } = await sb.from('vehicles').update({ [field]: null }).eq('id', vehicleId);
    if(error) toast('Erreur sauvegarde: '+error.message, true);
  }catch(e){ toast('Erreur suppression: '+e.message, true); }
}

async function uploadAmendeJustificatif(id, file){
  if(!file) return;
  const row = state.amendes.find(a=>a.id===id);
  if(!row) return;
  const path = `amendes/${id}/${Date.now()}_${file.name}`.replace(/\s+/g,'_');
  try{
    const { error: upErr } = await sb.storage.from('justificatifs').upload(path, file, { upsert:true });
    if(upErr) return toast('Erreur upload (le bucket "justificatifs" a-t-il été créé via schema_update_v2.sql ?): '+upErr.message, true);
    const urls = [...(row.justificatifs_urls||[]), path];
    const { error } = await sb.from('amendes').update({ justificatifs_urls: urls }).eq('id', id);
    if(error) return toast('Erreur sauvegarde: '+error.message, true);
    row.justificatifs_urls = urls;
    render();
  }catch(e){ toast('Erreur upload: '+e.message, true); }
}
async function viewAmendeJustificatif(id, idx){
  const row = state.amendes.find(a=>a.id===id);
  const path = row && row.justificatifs_urls && row.justificatifs_urls[idx];
  if(!path) return;
  try{
    const { data, error } = await sb.storage.from('justificatifs').createSignedUrl(path, 3600);
    if(error) return toast('Erreur ouverture: '+error.message, true);
    window.open(data.signedUrl, '_blank');
  }catch(e){ toast('Erreur ouverture: '+e.message, true); }
}
async function removeAmendeJustificatif(id, idx){
  if(!(await iosConfirm({message:'Retirer ce justificatif ?', confirmLabel:'Retirer'}))) return;
  const row = state.amendes.find(a=>a.id===id);
  if(!row) return;
  const path = (row.justificatifs_urls||[])[idx];
  const urls = (row.justificatifs_urls||[]).filter((_,i)=>i!==idx);
  row.justificatifs_urls = urls;
  render();
  try{
    if(path) await sb.storage.from('justificatifs').remove([path]);
    const { error } = await sb.from('amendes').update({ justificatifs_urls: urls }).eq('id', id);
    if(error) toast('Erreur sauvegarde: '+error.message, true);
  }catch(e){ toast('Erreur suppression: '+e.message, true); }
}

function renderNotifStatus(){
  const el = document.getElementById('notifStatus');
  const btn = document.getElementById('notifBtn');
  if(!el || !btn) return;
  if(!('Notification' in window)){
    el.textContent = 'Non disponible dans ce navigateur.';
    btn.style.display = 'none';
    return;
  }
  const perm = Notification.permission;
  if(perm==='denied'){
    el.textContent = '❌ Refusées — à réactiver dans Réglages iOS → SBR AUTO → Notifications.';
    btn.style.display = 'none';
    return;
  }
  if(perm!=='granted'){
    el.textContent = 'Pas encore activées.';
    btn.textContent = '🔔 Activer les notifications';
    btn.style.display = 'block';
    btn.onclick = requestNotifPermission;
    return;
  }
  getPushSubscription().then(sub=>{
    if(sub){
      el.textContent = '✅ Activées sur cet appareil — tu recevras les alertes en temps réel.';
      btn.textContent = 'Désactiver sur cet appareil';
      btn.style.display = 'block';
      btn.onclick = async () => { await unsubscribeFromPush(); renderNotifStatus(); };
    } else {
      el.textContent = 'Badge autorisé, mais notifications pas encore activées sur cet appareil.';
      btn.textContent = '🔔 Activer les notifications';
      btn.style.display = 'block';
      btn.onclick = requestNotifPermission;
    }
  });
}
async function requestNotifPermission(){
  if(!('Notification' in window)){ toast('Non disponible dans ce navigateur.', true); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm==='granted'){
      try{
        await subscribeToPush();
        toast('Notifications activées ✓');
      }catch(e){
        console.error(e);
        toast('Badge activé, mais les notifications push ont échoué.', true);
      }
      const alerts = vehicleAlerts();
      const total = alerts.detailed.length;
      updateAppBadge(total);
    } else if(perm==='denied'){
      toast('Notifications refusées — le badge ne pourra pas s\'afficher.', true);
    }
    renderNotifStatus();
  }catch(e){ toast('Erreur: '+e.message, true); }
}

async function emptyTrash(){
  const defs = ['renta_lignes','amendes','vehicles','accessories','entretiens'];
  const toDelete = [];
  defs.forEach(table=>{
    state[table].filter(x=>x.deleted_at).forEach(x=>toDelete.push({table, id:x.id}));
  });
  if(toDelete.length===0) return;
  if(!(await iosConfirm({message:`Supprimer définitivement les ${toDelete.length} élément(s) de la corbeille ? Cette action est irréversible.`, confirmLabel:'Tout supprimer'}))) return;
  let failed = 0;
  for(const {table, id} of toDelete){
    try{
      const { error } = await sb.from(table).delete().eq('id', id);
      if(error){ failed++; continue; }
      state[table] = state[table].filter(x=>x.id!==id);
    }catch(e){ failed++; }
  }
  render();
  if(failed>0) toast(`${failed} élément(s) n'ont pas pu être supprimés définitivement.`, true);
}

/* Enregistrement du service worker — active le mode PWA (icône plein écran,
   chargement instantané, résilience hors-ligne pour l'interface) — et bandeau
   "Nouvelle version disponible" quand un déploiement plus récent est détecté. */
function showUpdateBanner(reg){
  if(document.getElementById('updateBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBanner';
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;box-shadow:0 -4px 16px rgba(0,0,0,.2);';
  bar.innerHTML = `<span>🔄 Nouvelle version de SBR AUTO disponible.</span><button style="background:#fff;color:var(--primary);border:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;">Mettre à jour</button>`;
  bar.querySelector('button').onclick = () => {
    if(reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    bar.querySelector('button').textContent = '...';
  };
  document.body.appendChild(bar);
}
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      if(reg.waiting) showUpdateBanner(reg);
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        if(!newSW) return;
        newSW.addEventListener('statechange', () => {
          if(newSW.state==='installed' && navigator.serviceWorker.controller) showUpdateBanner(reg);
        });
      });
    }).catch(()=>{});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}

// Génère un vrai UUID v4 — obligatoire, les colonnes Supabase sont de type "uuid"
// et rejettent tout id qui n'a pas ce format exact.
function cid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function isValidUUID(id){ return typeof id==='string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id); }
// Répare les ids générés par l'ancienne version de cid() (non conformes UUID),
// qui faisaient échouer toute synchronisation avec Supabase.
function repairInvalidIds(){
  let changed = false;
  [DATA.transactions, DATA.declarations, DATA.rules].forEach(arr=>{
    arr.forEach(item=>{ if(!isValidUUID(item.id)){ item.id = cid(); changed = true; } });
  });
  return changed;
}

// window.storage n'existe QUE dans l'environnement Claude (artifact) — sur Vercel il
// n'existe pas du tout. On utilise localStorage du navigateur comme stockage local
// une fois hébergé ailleurs, sans que rien ne casse.
const hasArtifactStorage = !!(window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function');
async function localGetKV(key){
  try{
    if(hasArtifactStorage){ const r = await window.storage.get(key, false); return r ? r.value : null; }
    return localStorage.getItem(key);
  }catch(e){ return null; }
}
async function localSetKV(key, value){
  if(hasArtifactStorage) return window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return true;
}

async function loadData(){
  try{
    const entries = await Promise.all(Object.entries(KEYS).map(async ([k,key])=>{
      const v = await localGetKV(key); return [k, v];
    }));
    const map = Object.fromEntries(entries);
    let migrated = false;
    if(map.transactions===null && map.settings===null){
      for(const legacyKey of LEGACY_KEYS){
        try{
          const oldVal = await localGetKV(legacyKey);
          if(oldVal){
            const legacy = JSON.parse(oldVal);
            DATA.transactions = legacy.transactions||[];
            DATA.declarations = legacy.declarations||[];
            DATA.rules = (legacy.rules&&legacy.rules.length) ? legacy.rules : defaultRules();
            DATA.settings = Object.assign(DATA.settings, legacy.settings||{});
            migrated = true;
            break;
          }
        }catch(e){}
      }
      if(!DATA.rules.length) DATA.rules = defaultRules();
    } else {
      if(map.transactions) DATA.transactions = JSON.parse(map.transactions);
      if(map.declarations) DATA.declarations = JSON.parse(map.declarations);
      if(map.rules) DATA.rules = JSON.parse(map.rules);
      if(map.settings) DATA.settings = Object.assign(DATA.settings, JSON.parse(map.settings));
    }
    if(!DATA.rules || !DATA.rules.length) DATA.rules = defaultRules();
    DATA.settings = Object.assign(defaultSettings(), DATA.settings);
    const repaired = repairInvalidIds();
    if(migrated || repaired) await saveData();
  }catch(e){ console.error('loadData', e); if(!DATA.rules.length) DATA.rules = defaultRules(); }
}

async function saveData(){
  const jobs = [
    ['transactions', KEYS.transactions, JSON.stringify(DATA.transactions)],
    ['declarations', KEYS.declarations, JSON.stringify(DATA.declarations)],
    ['rules', KEYS.rules, JSON.stringify(DATA.rules)],
    ['settings', KEYS.settings, JSON.stringify(DATA.settings)],
  ];
  const results = await Promise.allSettled(jobs.map(([name,key,val])=>localSetKV(key, val)));
  const failed = results.map((r,i)=>({r,name:jobs[i][0]})).filter(x=>x.r.status==='rejected');
  if(failed.length){
    console.error('saveData failed for', failed.map(f=>f.name));
    cptToast(`⚠️ Sauvegarde locale incomplète (${failed.map(f=>f.name).join(', ')}) — espace de stockage plein ? Essaie de retirer un justificatif volumineux.`);
  }
  if(sb && session){
    try{ await pushToCloud(); }
    catch(e){ console.error('pushToCloud', e); cptToast('⚠️ Non synchronisé avec Supabase : '+(e && e.message ? e.message : 'erreur inconnue')); }
  }
}

};
// La table Supabase a une contrainte unique (user_id, periode). Si l'état local
// se désynchronise (ex : app fermée entre la création d'une déclaration et sa
// sauvegarde), deux objets avec des IDs différents peuvent finir par exister
// localement pour la même période — on les fusionne systématiquement avant
// tout envoi ou usage, pour ne jamais renvoyer ce conflit à Supabase.
function dedupeDeclarations(){
  const map = new Map();
  DATA.declarations.forEach(d=>{
    const existing = map.get(d.periode);
    if(!existing){ map.set(d.periode, d); return; }
    existing.statutDeclare = existing.statutDeclare || d.statutDeclare;
    existing.statutPaye = existing.statutPaye || d.statutPaye;
    if(!existing.dateDeclare || (d.dateDeclare && d.dateDeclare > existing.dateDeclare)) existing.dateDeclare = d.dateDeclare;
    if(!existing.datePaye || (d.datePaye && d.datePaye > existing.datePaye)) existing.datePaye = d.datePaye;
    if(!existing.reference && d.reference) existing.reference = d.reference;
  });
  DATA.declarations = Array.from(map.values());
}
async function pullFromCloud(){
  if(!sb || !session) return;
  const uid = session.user.id;
  try{
    const [tx, decl, rules, settings] = await Promise.all([
      sb.from('transactions').select('*').eq('user_id',uid),
      sb.from('declarations').select('*').eq('user_id',uid),
      sb.from('rules').select('*').eq('user_id',uid),
      sb.from('settings').select('*').eq('user_id',uid).maybeSingle(),
    ]);
    DATA.transactions = (tx.data||[]).map(R.tx);
    DATA.declarations = (decl.data||[]).map(R.decl);
    dedupeDeclarations();
    DATA.rules = (rules.data||[]).map(R.rule);
    if(settings.data) DATA.settings = Object.assign(DATA.settings, R.settings(settings.data));
    if(!DATA.rules.length){ DATA.rules = defaultRules(); await pushToCloud(); }
    DATA.lastSyncAt = new Date().toISOString();
    updateSyncIndicator();
    checkClientNotifications();
  }catch(e){ console.error('pullFromCloud', e); cptToast('⚠️ Impossible de charger depuis Supabase — données locales utilisées'); }
}
async function syncTable(table, rows, uid){
  if(rows.length){
    const {error} = await sb.from(table).upsert(rows);
    if(error) throw new Error(`table "${table}" : ${error.message}`);
  }
  // Sécurité : si la liste locale est vide, on ne purge jamais toute la table côté
  // Supabase sans filtre explicite (ça viderait tout pour cet utilisateur au moindre
  // souci de chargement).
  if(!rows.length) return;
  // On ne demande QUE les IDs distants (pas les colonnes) : léger et sans limite de
  // taille de requête. On calcule ensuite nous-mêmes, côté client, les IDs à
  // supprimer (présents à distance mais plus en local) — normalement une poignée,
  // jamais toute la table. On évite ainsi d'envoyer un NOT IN(...) avec des centaines
  // d'IDs (ex : les ~460 règles par défaut), qui dépasse la taille de requête
  // acceptée par Supabase et provoque un 400 Bad Request.
  const { data: remoteRows, error: listError } = await sb.from(table).select('id').eq('user_id', uid);
  if(listError) throw new Error(`table "${table}" (lecture) : ${listError.message}`);
  const localIds = new Set(rows.map(r=>r.id));
  const idsToDelete = (remoteRows||[]).map(r=>r.id).filter(id=>!localIds.has(id));
  if(!idsToDelete.length) return;
  const CHUNK = 200;
  for(let i=0; i<idsToDelete.length; i+=CHUNK){
    const chunk = idsToDelete.slice(i, i+CHUNK);
    const { error: delError } = await sb.from(table).delete().eq('user_id', uid).in('id', chunk);
    if(delError) throw new Error(`table "${table}" (nettoyage) : ${delError.message}`);
  }
}
async function pushToCloud(){
  if(!sb || !session) return;
  const uid = session.user.id;
  await syncTable('transactions', DATA.transactions.map(t=>({id:t.id,user_id:uid,date:t.date,libelle:t.libelle,montant:t.montant,type:t.type,categorie:t.categorie,justificatif:t.justificatif,statut_rapprochement:t.statutRapprochement,pointe:!!t.pointe,deleted:!!t.deleted,deleted_at:t.deletedAt||null,cotisations_prelevees:!!t.cotisationsPrelevees,
    fournisseur:t.fournisseur||null, siret:t.siret||null, numero_facture:t.numeroFacture||null,
    montant_ht:t.montantHT??null, taux_tva:t.tauxTVA??null, montant_tva:t.montantTVA??null, montant_ttc:t.montantTTC??null,
    tva_deductible:t.tvaDeductible??null, tva_non_deductible:t.tvaNonDeductible??null,
    ia_justification:t.iaJustification||null, ia_source:t.iaSource||null, ia_confiance:t.iaConfiance||null,
    verification_necessaire:!!t.verificationNecessaire, tva_verifiee:!!t.tvaVerifiee, tva_modifie_manuel:!!t.tvaModifieManuel})), uid);
  dedupeDeclarations();
  await syncTable('declarations', DATA.declarations.map(d=>({id:d.id,user_id:uid,periode:d.periode,statut_declare:d.statutDeclare,statut_paye:d.statutPaye,date_declare:d.dateDeclare||null,date_paye:d.datePaye||null,reference:d.reference||null})), uid);
  await syncTable('rules', DATA.rules.map(r=>({id:r.id,user_id:uid,motcle:r.motcle,type:r.type,categorie:r.categorie})), uid);
  const { error: settingsError } = await sb.from('settings').upsert({user_id:uid, periodicite:DATA.settings.periodicite, taux_service:DATA.settings.tauxService, taux_vente:DATA.settings.tauxVente, taux_cfp_service:DATA.settings.tauxCFPService, taux_cfp_vente:DATA.settings.tauxCFPVente, versement_liberatoire_actif:DATA.settings.versementLiberatoireActif, taux_vl_service:DATA.settings.tauxVLService, taux_vl_vente:DATA.settings.tauxVLVente, tva_actif:!!DATA.settings.tvaActif});
  if(settingsError) throw new Error(`réglages : ${settingsError.message}`);
  DATA.lastSyncAt = new Date().toISOString();
  DATA.lastSyncError = null;
  updateSyncIndicator();
}

  if(txt) txt.textContent = DATA.lastSyncAt ? `Dernière synchro à ${new Date(DATA.lastSyncAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}` : 'Pas encore synchronisé';
}
async function testSupabaseConnection(){
  if(!sb || !session) return { ok:false, message:"Pas connecté." };
  try{
    const { error } = await sb.from('transactions').select('id').limit(1);
    if(error) return { ok:false, message: error.message };
    return { ok:true, message:"Connexion et tables OK." };
  }catch(e){ return { ok:false, message: (e&&e.message)||String(e) }; }
}

async function setupNotifications(){
  const bellWrap = document.getElementById('bellWrap');
  if(bellWrap) bellWrap.style.display='block';
  const dot = document.getElementById('syncDot');
  if(dot){ dot.style.display='block'; updateSyncIndicator(); }
  await refreshNotifications();
  document.getElementById('bellBtn').onclick = toggleNotifPanel;
  try{
    sb.channel('notifications-'+session.user.id)
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'notifications', filter:`user_id=eq.${session.user.id}`}, (payload)=>{
        cloudNotifications.unshift(payload.new);
        updateBellBadge();
        cptToast('🔔 '+payload.new.title);
        if(DATA.settings.notifsActivees && 'Notification' in window && Notification.permission==='granted'){
          try{ new Notification(payload.new.title, {body:payload.new.body}); }catch(e){}
        }
      }).subscribe();
  }catch(e){ console.error('realtime sub failed', e); }
}
async function refreshNotifications(){
  try{
    const { data } = await sb.from('notifications').select('*').eq('user_id', session.user.id).order('created_at',{ascending:false}).limit(30);
    cloudNotifications = data||[];
    updateBellBadge();
  }catch(e){ console.error(e); }
}
function updateBellBadge(){
  const n = cloudNotifications.filter(x=>!x.read).length;
  const badge = document.getElementById('bellBadge');
  if(!badge) return;
  badge.style.display = n ? 'flex' : 'none';
  badge.textContent = n>9 ? '9+' : n;
}
function toggleNotifPanel(){
  let panel = document.getElementById('notifPanel');
  if(panel){ panel.remove(); return; }
  panel = document.createElement('div');
  panel.className='notif-panel'; panel.id='notifPanel';
  panel.innerHTML = cloudNotifications.length ? cloudNotifications.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}"><b>${esc(n.title)}</b>${esc(n.body)}<div class="muted" style="margin-top:3px">${new Date(n.created_at).toLocaleString('fr-FR')}</div></div>
  `).join('') : `<div class="empty">Aucune notification</div>`;
  document.getElementById('bellWrap').appendChild(panel);
  cloudNotifications.forEach(n=>n.read=true);
  sb.from('notifications').update({read:true}).eq('user_id', session.user.id).eq('read', false).then(()=>updateBellBadge());
  setTimeout(()=>{ document.addEventListener('click', function h(e){ if(!panel.contains(e.target) && e.target.id!=='bellBtn'){ panel.remove(); document.removeEventListener('click',h); } }); },0);
}
async function checkClientNotifications(){
  if(!sb || !session) return;
  try{
    const uid = session.user.id;
    const cutoff = Date.now() - 7*24*3600*1000;
    const stale = activeTx().filter(t=>(t.categorie==='Autre recette'||t.categorie==='Autre dépense') && new Date(t.date).getTime()<cutoff);
    for(const t of stale.slice(0,10)){
      const refId = `averifier-${t.id}`;
      const { data: already } = await sb.from('notifications').select('id').eq('user_id',uid).eq('ref_id',refId).maybeSingle();
      if(!already){
        await sb.from('notifications').insert({ user_id:uid, type:'info', ref_id:refId,
          title:'Écriture à vérifier', body:`"${t.libelle}" (${fmtEUR(Math.abs(t.montant))}) n'a toujours pas de catégorie reconnue depuis plus d'une semaine.` });
      }
    }
    const dups = findDuplicates();
    const seenPairs = new Set();
    for(const t of dups){
      const key = t.date+'|'+Math.abs(t.montant).toFixed(2);
      if(seenPairs.has(key)) continue; seenPairs.add(key);
      const refId = `doublon-${key}`;
      const { data: already } = await sb.from('notifications').select('id').eq('user_id',uid).eq('ref_id',refId).maybeSingle();
      if(!already){
        await sb.from('notifications').insert({ user_id:uid, type:'info', ref_id:refId,
          title:'Doublon potentiel', body:`Plusieurs écritures du ${fmtDate(t.date)} pour ${fmtEUR(Math.abs(t.montant))} — vérifie qu'il n'y a pas de doublon.` });
      }
    }
  }catch(e){ console.error('checkClientNotifications', e); }
}

function cptToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toastHost').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function mdToHtml(s){
  if(!s) return '';
  const inline = t => esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+?)\*($|[^*])/g,'$1<em>$2</em>$3');
  const lines = String(s).split('\n');
  let html='', inList=false, tableBuf=[];
  const flushList = ()=>{ if(inList){ html+='</ul>'; inList=false; } };
  const flushTable = ()=>{
    if(!tableBuf.length) return;
    const rows = tableBuf.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r.replace(/\|/g,'').trim()===''?'':r));
    const dataRows = tableBuf.filter(r=>!/^[\s|:-]+$/.test(r));
    html += '<table class="ia-table"><tbody>'+dataRows.map((r,i)=>{
      const cells = r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
      const tag = i===0?'th':'td';
      return '<tr>'+cells.map(c=>`<${tag}>${inline(c)}</${tag}>`).join('')+'</tr>';
    }).join('')+'</tbody></table>';
    tableBuf=[];
  };
  for(const line of lines){
    if(/^\s*\|.*\|\s*$/.test(line)){ tableBuf.push(line); continue; }
    else if(tableBuf.length){ flushTable(); }
    if(/^\s*#{3}\s+/.test(line)){ flushList(); html+=`<h4>${inline(line.replace(/^\s*#{3}\s+/,''))}</h4>`; continue; }
    if(/^\s*#{2}\s+/.test(line)){ flushList(); html+=`<h3>${inline(line.replace(/^\s*#{2}\s+/,''))}</h3>`; continue; }
    if(/^\s*#{1}\s+/.test(line)){ flushList(); html+=`<h3>${inline(line.replace(/^\s*#{1}\s+/,''))}</h3>`; continue; }
    if(/^\s*[-*]\s+/.test(line)){ if(!inList){ html+='<ul>'; inList=true; } html+=`<li>${inline(line.replace(/^\s*[-*]\s+/,''))}</li>`; continue; }
    flushList();
    if(line.trim()===''){ continue; }
    html+=`<p>${inline(line)}</p>`;
  }
  flushList(); flushTable();
  return html;
}
// fmtEUR / fmtDate réutilisés depuis SBR AUTO (mêmes formats fr-FR).
function monthKey(dateStr){ const d=new Date(dateStr); if(isNaN(d)) return '????-??'; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function quarterKey(dateStr){ const d=new Date(dateStr); if(isNaN(d)) return '????-T?'; const q=Math.floor(d.getMonth()/3)+1; return d.getFullYear()+'-T'+q; }
function periodKey(dateStr){ return DATA.settings.periodicite==='mensuel' ? monthKey(dateStr) : quarterKey(dateStr); }
function periodLabel(key){
  if(/T\d/.test(key)){ const [y,t]=key.split('-'); return 'T'+t.slice(1)+' '+y; }
  const [y,m]=key.split('-'); const noms=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return (noms[parseInt(m,10)-1]||m)+' '+y;
}
// Échéance URSSAF réelle estimée : dernier jour du mois suivant la fin de la période
// (règle générale déclarant mensuel/trimestriel — vérifie la date exacte sur ton compte autoentrepreneur.urssaf.fr)
function joursRestants(dateStr){
  const d = new Date(dateStr); const now = new Date();
  d.setHours(0,0,0,0); now.setHours(0,0,0,0);
  return Math.round((d-now)/(24*3600*1000));
}
function urssafDeadline(key){
  let year, monthEndOfPeriod; // monthEndOfPeriod = dernier mois (1-12) de la période
  if(/T\d/.test(key)){ const [y,t]=key.split('-'); year=parseInt(y,10); monthEndOfPeriod = parseInt(t.slice(1),10)*3; }
  else { const [y,m]=key.split('-'); year=parseInt(y,10); monthEndOfPeriod = parseInt(m,10); }
  let deadlineMonth = monthEndOfPeriod + 2; // mois suivant, +1 pour index 0-based côté Date
  let deadlineYear = year;
  if(deadlineMonth > 12){ deadlineMonth -= 12; deadlineYear += 1; }
  return new Date(deadlineYear, deadlineMonth - 1, 0); // jour 0 du mois suivant = dernier jour du mois voulu
}
function guessCategorie(libelle, montant){
  const l = (libelle||'').toLowerCase();
  const matches = DATA.rules.filter(r=>r.motcle && l.includes(r.motcle.toLowerCase()));
  if(matches.length){
    // le mot-clé le plus long gagne, et à longueur égale on préfère la règle cohérente avec le signe du montant
    const signe = montant>=0 ? 'recette' : 'depense';
    matches.sort((a,b)=>{
      const coherent = r => (r.type==='prelevement' ? 1 : r.type==='apport' ? (montant>=0 ? 3 : 0) : (r.type===signe ? 2 : 0));
      return (coherent(b)-coherent(a)) || (b.motcle.length-a.motcle.length);
    });
    const r = matches[0];
    return { type:r.type, categorie:r.categorie };
  }
  return { type: montant>=0 ? 'recette':'depense', categorie: montant>=0 ? 'Autre recette':'Autre dépense' };
}
function parseAmountFR(s){
  if(typeof s === 'number') return s;
  if(!s) return NaN;
  let x = String(s).trim().replace(/\s/g,'').replace(/[€]/g,'');
  x = x.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',', '.');
  return parseFloat(x);
}
function isVenteCategorie(cat){ return (cat||'').toLowerCase().includes('vente'); }
function tauxTotalVente(s){ return s.tauxVente + s.tauxCFPVente + (s.versementLiberatoireActif ? s.tauxVLVente : 0); }
function tauxTotalService(s){ return s.tauxService + s.tauxCFPService + (s.versementLiberatoireActif ? s.tauxVLService : 0); }
function cotisationsDuesFor(recettesList, s){
  let vente=0, service=0;
  recettesList.forEach(t=>{ if(isVenteCategorie(t.categorie)) vente+=t.montant; else service+=t.montant; });
  return { vente, service, total: vente*tauxTotalVente(s)/100 + service*tauxTotalService(s)/100 };
}

/* ================= CALCULS PARTAGÉS ================= */
function totalsByType(){
  const t = {recette:0, depense:0, prelevement:0, apport:0};
  activeTx().forEach(tx=>{ if(tx.type==='recette') t.recette += tx.montant; else t[tx.type] = (t[tx.type]||0) + Math.abs(tx.montant); });
  return t;
}
function cotisationsPayeesTotal(){
  const recettes = activeTx().filter(t=>t.type==='recette' && !t.cotisationsPrelevees);
  const periods = {};
  recettes.forEach(t=>{ const k=periodKey(t.date); periods[k]=periods[k]||[]; periods[k].push(t); });
  let total=0;
  DATA.declarations.forEach(d=>{
    if(d.statutPaye && periods[d.periode]){ total += cotisationsDuesFor(periods[d.periode], DATA.settings).total; }
  });
  return total;
}

function trendChartSVG(points){
  const w=640, h=150, padL=8, padR=8, padT=10, padB=26;
  const vals = points.map(p=>p.value);
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const range = (max-min)||1;
  const stepX = (w-padL-padR)/Math.max(1,points.length-1);
  const xy = points.map((p,i)=>({x: padL + i*stepX, y: padT + (1 - (p.value-min)/range) * (h-padT-padB), ...p}));
  const path = xy.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaPath = path + ` L${xy[xy.length-1].x.toFixed(1)},${h-padB} L${xy[0].x.toFixed(1)},${h-padB} Z`;
  const dots = xy.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#4fb2ff"/>`).join('');
  const labels = xy.map((p,i)=>{
    if(!(i===0||i===xy.length-1||xy.length<=6)) return '';
    const anchor = i===0 ? 'start' : (i===xy.length-1 ? 'end' : 'middle');
    const x = i===0 ? padL : (i===xy.length-1 ? w-padR : p.x);
    return `<text x="${x.toFixed(1)}" y="${h-8}" font-size="11" fill="#8b9bb0" text-anchor="${anchor}">${esc(p.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4fb2ff" stop-opacity="0.25"/><stop offset="100%" stop-color="#4fb2ff" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaPath}" fill="url(#areaGrad)"/><path d="${path}" fill="none" stroke="#4fb2ff" stroke-width="2"/>${dots}${labels}
  </svg>`;
}
const DONUT_COLORS = ['#4fb2ff','#2fd398','#ffc266','#b39bfb','#ff6b6b','#3e8fd6','#1fae82','#e6a94f','#8f74e8','#d95a5a'];
function donutChartSVG(entries){
  const top = entries.slice(0,7);
  const rest = entries.slice(7).reduce((s,e)=>s+e[1],0);
  if(rest>0) top.push(['Autres', rest]);
  const total = top.reduce((s,e)=>s+e[1],0) || 1;
  const cx=90, cy=90, r=70, rInner=42;
  let angle = -Math.PI/2;
  const arcs = top.map((e,i)=>{
    const frac = e[1]/total;
    const a0 = angle, a1 = angle + frac*Math.PI*2;
    angle = a1;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const xi0 = cx + rInner*Math.cos(a1), yi0 = cy + rInner*Math.sin(a1);
    const xi1 = cx + rInner*Math.cos(a0), yi1 = cy + rInner*Math.sin(a0);
    const path = `M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} L${xi0.toFixed(2)},${yi0.toFixed(2)} A${rInner},${rInner} 0 ${large} 0 ${xi1.toFixed(2)},${yi1.toFixed(2)} Z`;
    return `<path d="${path}" fill="${DONUT_COLORS[i%DONUT_COLORS.length]}"/>`;
  }).join('');
  const legend = top.map((e,i)=>`
    <div style="display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px">
      <span style="width:10px;height:10px;border-radius:3px;background:${DONUT_COLORS[i%DONUT_COLORS.length]};flex-shrink:0"></span>
      <span style="flex:1;color:var(--muted)">${esc(e[0])}</span>
      <span style="font-weight:600">${fmtEUR(e[1])}</span>
      <span class="muted" style="width:36px;text-align:right">${Math.round(e[1]/total*100)}%</span>
    </div>`).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" style="width:150px;height:150px;flex-shrink:0">${arcs}</svg>
    <div style="flex:1;min-width:180px">${legend}</div>
  </div>`;
}
function declStatut(decl){ if(!decl) return 'a_faire'; if(decl.statutPaye) return 'paye'; if(decl.statutDeclare) return 'declare_non_paye'; return 'a_faire'; }
function pillDecl(s){
  if(s==='paye') return `<span class="pill pill-paye">Payé</span>`;
  if(s==='declare_non_paye') return `<span class="pill pill-attente">Déclaré, pas payé</span>`;
  return `<span class="pill pill-retard">À déclarer</span>`;
}

function compressImageFile(file, maxW=700, quality=0.45){
  return new Promise((resolve, reject)=>{
    const img = new Image(); const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}
async function handleJustificatif(file, txId){
  const tx = DATA.transactions.find(t=>t.id===txId); if(!tx) return;
  try{
    const isPdf = file.type === 'application/pdf';
    if(isPdf && file.size > 5*1024*1024){ cptToast('⚠️ PDF trop volumineux (max 5 Mo)'); return; }
    let blob, ext;
    if(isPdf){ blob = file; ext='pdf'; } else { const dataUrl = await compressImageFile(file); blob = await (await fetch(dataUrl)).blob(); ext='jpg'; }
    if(sb && session){
      const path = `${session.user.id}/${txId}-${Date.now()}.${ext}`;
      const { error } = await sb.storage.from('justificatifs').upload(path, blob, {contentType: isPdf?'application/pdf':'image/jpeg', upsert:true});
      if(error){ console.error(error); cptToast('⚠️ Upload impossible — vérifie le bucket "justificatifs" (relance schema.sql)'); return; }
      tx.justificatif = path;
    } else {
      tx.justificatif = isPdf ? await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }) : await compressImageFile(file);
    }
    await saveData(); cptToast('📎 Justificatif attaché ✅'); renderCompta();
  }catch(e){ console.error(e); cptToast('Impossible de lire ce fichier'); }
}
window.openJustificatif = async (txId)=>{
  const tx = DATA.transactions.find(t=>t.id===txId); if(!tx || !tx.justificatif) return;
  let url = tx.justificatif; let isPdf = url.startsWith('data:application/pdf');
  if(!url.startsWith('data:')){
    if(!sb){ cptToast('⚠️ Connecte-toi à Supabase pour voir ce justificatif'); return; }
    const { data, error } = await sb.storage.from('justificatifs').createSignedUrl(url, 120);
    if(error || !data){ cptToast('⚠️ Impossible de charger le justificatif'); return; }
    url = data.signedUrl; isPdf = tx.justificatif.endsWith('.pdf');
  }
  openDocViewer({url, isPdf, title:'Justificatif — '+(tx.libelle||'')});
};
window.triggerJustificatifInput = (txId)=>{
  const input = document.createElement('input');
  input.type='file'; input.accept='image/*,application/pdf'; input.capture='environment';

function countAVerifier(){
  const uncategorized = activeTx().filter(t=>t.categorie==='Autre recette'||t.categorie==='Autre dépense').length;
  return uncategorized + findDuplicates().length;
}
function findDuplicates(){
  const seen = {}; const dups = [];
  activeTx().forEach(t=>{ const key = t.date+'|'+Math.abs(t.montant).toFixed(2)+'|'+t.type; (seen[key]=seen[key]||[]).push(t); });
  Object.values(seen).forEach(group=>{ if(group.length>1) dups.push(...group); });
  return dups;
}

  r.type = type;

function handleFile(file){
  if(file.type && file.type!=='application/pdf' && !/\.pdf$/i.test(file.name||'')){
    cptToast('Choisis un relevé au format PDF'); return;
  }
  parsePDFFile(file);
}
function normalizeDate(raw){
  if(!raw) return new Date().toISOString().slice(0,10);
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=m[3]; if(y.length===2) y='20'+y; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return new Date().toISOString().slice(0,10);
}
async function parsePDFFile(file){
  cptToast('Lecture du PDF…');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    const pages = [];
    for(let p=1;p<=pdf.numPages;p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      pages.push(content.items
        .filter(it=>it.str && it.str.trim()!=='')
        .map(it=>({ str: it.str.trim(), x: it.transform[4], y: it.transform[5] })));
    }
    if(!pages.some(items=>items.length)){
      cptToast('Ce PDF ne contient pas de texte (relevé scanné) — saisis les lignes à la main');
      return;
    }
    const staged = extractStatementRows(pages);
    if(!staged.length){ cptToast('Aucune ligne détectée dans le PDF — vérifie/complète manuellement'); return; }
    cptToast('🤖 ROOT IA analyse tes écritures…');
    const classified = await classifyStagedWithAI(staged);
    stagedImport = stagedImport.concat(classified);
    cptToast(`${classified.length} lignes détectées`);
    renderCompta();
  }catch(e){ console.error(e); cptToast('Impossible de lire ce PDF (peut-être scanné/image)'); }
}

/* ---------- Lecture d'un relevé bancaire PDF ----------
   Les relevés sont des tableaux : une ligne visuelle porte la date à gauche et le
   montant à droite, le libellé pouvant être sur la ligne juste au-dessus. On
   reconstruit donc les lignes à partir des coordonnées du texte, au lieu de lire
   le PDF comme un bloc de texte continu. */
const AMOUNT_RE = /^-?\d{1,3}(?:[\s.\u00a0\u202f]\d{3})*[.,]\d{2}$/;
function amountText(str){
  const t = (str||'').replace(/^€/, '').replace(/€$/, '').trim();
  return AMOUNT_RE.test(t) ? t : null;
}
const DATE_RE = /^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/;

function pdfRows(items){
  const rows = [];
  items.slice().sort((a,b)=> b.y - a.y || a.x - b.x).forEach(it=>{
    const row = rows.length && Math.abs(rows[rows.length-1].y - it.y) <= 2.5 ? rows[rows.length-1] : null;
    if(row) row.items.push(it);
    else rows.push({ y: it.y, items:[it] });
  });
  rows.forEach(r=>{ r.items.sort((a,b)=>a.x-b.x); r.items = mergeAmountParts(r.items); });
  return rows;
}
/* "-1 000,00" est parfois découpé en deux morceaux par le PDF : on les recolle. */
function mergeAmountParts(items){
  const out = [];
  for(let i=0;i<items.length;i++){
    const cur = items[i], next = items[i+1];
    if(next && /^-?\d{1,3}$/.test(cur.str) && /^\d{3}([.,]\d{2})?\s*€?$/.test(next.str) && (next.x - cur.x) < 30){
      const joined = cur.str + ' ' + next.str;
      if(amountText(joined) || /^-?\d{1,3} \d{3}\s*€?$/.test(joined)){
        out.push({ str: joined, x: cur.x, y: cur.y }); i++; continue;
      }
    }
    out.push(cur);
  }
  return out;
}
function statementPeriod(pages){
  const txt = pages.map(items=>items.map(i=>i.str).join(' ')).join(' ');
  let m = txt.match(/(20\d{2})-(\d{2})-(\d{2})/);
  if(m) return { year: +m[1], month: +m[2] };
  m = txt.match(/\b(\d{2})\/(\d{2})\/(20\d{2})\b/);
  if(m) return { year: +m[3], month: +m[2] };
  const now = new Date();
  return { year: now.getFullYear(), month: now.getMonth()+1 };
}
/* Un relevé sur deux colonnes (Débit / Crédit) donne le sens par la colonne ;
   sinon on se fie au signe écrit devant le montant. */
function amountColumns(pages){
  let debit = null, credit = null;
  pages.forEach(items=>items.forEach(it=>{
    const t = it.str.toLowerCase();
    if(debit===null && /^d[ée]bit/.test(t)) debit = it.x;
    if(credit===null && /^cr[ée]dit/.test(t)) credit = it.x;
  }));
  return (debit!==null && credit!==null && credit > debit) ? {debit, credit} : null;
}
/* En-têtes et pieds de page : même texte, même hauteur, sur plusieurs pages. */
function repeatedLines(pagesRows){
  const seen = new Map();
  pagesRows.forEach((rows, pi)=>{
    if(!rows.length) return;
    const ys = rows.map(r=>r.y), haut = Math.max(...ys), bas = Math.min(...ys), h = haut - bas || 1;
    rows.forEach(r=>{
      const marge = (r.y - bas) / h;
      if(marge < 0.88 && marge > 0.12) return;   // le corps du tableau n'est jamais du bruit
      const key = r.items.map(i=>i.str).join(' ') + '@' + Math.round(r.y/4);
      if(!seen.has(key)) seen.set(key, new Set());
      seen.get(key).add(pi);
    });
  });
  const noise = new Set();
  seen.forEach((pagesSet, key)=>{ if(pagesSet.size > 1) noise.add(key); });
  return noise;
}
/* Lignes qui décrivent un détail technique, pas l'objet de l'opération. */
function isDetailLine(txt){
  if(!txt) return true;
  if(!/[a-zà-ÿ]/i.test(txt)) return true;
  if(txt.length > 80) return true;              // paragraphe d'information, pas un libellé
  if(/^[A-Z]{2,3}$/.test(txt)) return true;     // code pays resté seul
  return /^(vir de|iban|bic|ref|réf|frais\s*:|carte\s*:|information\b|\d)/i.test(txt)
    || /^[A-Z]{2,3}\s*-\s*\d{2}h/.test(txt)
    || /^[A-Z]{2,3}\s*-\s*-/.test(txt)
    || /\b(ancien solde|nouveau solde|total des op|report à nouveau|sous-total)\b/i.test(txt)
    || /^(date|opération|operation)\b/i.test(txt);
}
function extractStatementRows(pages){
  const period = statementPeriod(pages);
  const cols = amountColumns(pages);
  const pagesRows = pages.map(pdfRows);
  const noise = repeatedLines(pagesRows);
  const staged = [];

  pagesRows.forEach(rows=>{
    let pending = [];
    rows.forEach(row=>{
      const key = row.items.map(i=>i.str).join(' ') + '@' + Math.round(row.y/4);
      const dateItem = row.items.slice(0,2).find(it=>it.x < 140 && DATE_RE.test(it.str));
      const amounts = row.items.filter(it=>amountText(it.str) && (!cols || it.x > cols.debit - 60));

      const estEntete = row.items.some(it=>/^d[ée]bit/i.test(it.str)) && row.items.some(it=>/^cr[ée]dit/i.test(it.str));
      if(estEntete){ pending = []; return; }   // début du tableau : ce qui précède n'est pas une opération

      if(!dateItem || !amounts.length){
        if(!noise.has(key)){
          const txt = cleanLibelle(row.items.map(i=>i.str).join(' '));
          if(txt && !isDetailLine(txt) && !amountText(txt)) pending.push(txt);
          if(pending.length > 3) pending.shift();
        }
        return;
      }
      if(noise.has(key)) return;

      const amt = amounts[amounts.length-1], amtStr = amountText(amt.str);
      let montant = parseAmountFR(amtStr);
      if(isNaN(montant) || montant === 0){ pending = []; return; }
      montant = Math.abs(montant);
      const negatif = /^-/.test(amtStr) || (cols && Math.abs(amt.x-cols.debit) <= Math.abs(amt.x-cols.credit));
      if(negatif) montant = -montant;

      const reste = cleanLibelle(row.items
        .filter(it=>it !== dateItem && !amountText(it.str) && it.str !== '€')
        .map(i=>i.str).join(' '));
      const depuisBloc = pending.filter(l=>!isDetailLine(l)).join(' ').trim();
      let libelle = usable(depuisBloc) || usable(reste) || 'Ligne de relevé';

      const g = guessCategorie(libelle, montant);
      staged.push({
        date: pdfRowDate(dateItem.str, period),
        libelle: libelle.slice(0,120), montant,
        type: g.type, categorie: g.categorie
      });
      pending = [];
    });
  });
  return staged;
}
function usable(txt){
  const t = (txt||'').trim();
  return (t.length >= 3 && /[a-zà-ÿ]{3}/i.test(t)) ? t : '';
}
function cleanLibelle(txt){
  return (txt||'')
    .replace(/\b(IBAN|BIC|Ref|Réf|Carte|Frais)\s*:.*$/gi, ' ')
    .replace(/\b[A-Z]{2}\d{2}[A-Z0-9]{10,}\b/g, ' ')   // IBAN collé
    .replace(/\b\d{2}h\d{2}\b/g, ' ')
    .replace(/€/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .replace(/^[\s\-–—:]+|[\s\-–—:]+$/g, '')
    .trim();
}
/* Beaucoup de relevés n'écrivent que le jour et le mois : l'année vient de l'en-tête. */
function pdfRowDate(raw, period){
  const m = raw.match(DATE_RE);
  if(!m) return new Date().toISOString().slice(0,10);
  const jour = m[1].padStart(2,'0'), mois = m[2].padStart(2,'0');
  let annee;
  if(m[3]) annee = m[3].length === 2 ? '20'+m[3] : m[3];
  else {
    annee = period.year;
    const ecart = (+mois) - period.month;
    if(ecart > 6) annee -= 1;        // relevé de janvier contenant décembre
    else if(ecart < -6) annee += 1;
  }
  return `${annee}-${mois}-${jour}`;
}

/* -- appel centralisé à ROOT IA : Edge Function Supabase en priorité (Vercel), repli direct (Claude) -- */
async function callRootIA(prompt, maxTokens, opts){
  if(!sb || !session){
    throw new Error("Utilisateur non connecté à Supabase");
  }
  opts = opts || {};
  const body = { prompt, max_tokens: maxTokens };
  if(opts.file) body.file = opts.file; // {type:'image'|'document', media_type, data}
  if(opts.webSearch) body.web_search = true;

  const { data, error } = await sb.functions.invoke("root-ia", { body });

  if(error) throw error;
  if(!data || !data.text){
    throw new Error("Réponse ROOT IA vide");
  }

  return data.text;
}
async function classifyStagedWithAI(staged){
  if(!staged.length) return staged;
  try{
    const items = staged.map((r,i)=>({i, libelle:r.libelle, montant:r.montant}));
    const prompt = `Tu classes des lignes de relevé bancaire pour une micro-entreprise (SBR AUTO : location de véhicules via Getaround/Turo/Roadstr + vente de véhicules d'occasion). Pour chaque ligne, détermine :
- "type" : "recette" (argent reçu), "depense" (argent payé pour l'activité pro), "prelevement" (virement vers un compte personnel/rémunération), ou "apport" (argent que le dirigeant remet lui-même sur le compte depuis son compte personnel — uniquement si le libellé l'indique clairement, par exemple "apport perso" ou "apport personnel" ; sinon c'est une "recette")
- "categorie" : courte. Pour une recette de location, utilise le nom de la plateforme telle quelle : "Turo", "Getaround" ou "Roadstr" (sinon "Autre plateforme de location") ; pour une vente, "Vente de véhicules" ; pour une dépense/prélèvement, ex "Carburant", "Assurance", "Entretien/Réparation", "Péage/Parking", "Cotisations URSSAF", "Loyer/Local", "Virement compte personnel", ou une catégorie pertinente si aucune ne correspond
Lignes (JSON) :
${JSON.stringify(items)}
Réponds UNIQUEMENT avec un tableau JSON, sans texte autour ni balises markdown, exactement au format :
[{"i":0,"type":"recette","categorie":"Getaround"}]`;
    const text = await callRootIA(prompt, 3000);
    const jsonMatch = text.match(/\[[\s\S]*\]/);
    if(!jsonMatch) throw new Error('Réponse IA non exploitable');
    const results = JSON.parse(jsonMatch[0]);
    results.forEach(r=>{
      if(staged[r.i]){
        if(r.type && ['recette','depense','prelevement','apport'].includes(r.type)) staged[r.i].type = r.type;
        if(r.categorie) staged[r.i].categorie = r.categorie;
        staged[r.i].aiClassified = true;
      }
    });
    return staged;
  }catch(e){
    console.error('classifyStagedWithAI', e);
    cptToast('⚠️ Classification IA indisponible — catégorisation par mots-clés utilisée, vérifie bien les lignes');
    return staged;
  }
}

/* ================= MODULE TVA (ROOT IA) =================
   Générique : lecture de justificatifs (facture/ticket/reçu), extraction
   HT/TVA/TTC, détermination de la TVA déductible vs non déductible en
   consultant les sources officielles (impots.gouv.fr, BOFiP, Légifrance,
   service-public.fr) via ROOT IA + recherche web, tableau de bord TVA,
   historique, corrections manuelles, détection d'anomalies, exports. */
const TVA_TAUX = [0, 2.1, 5.5, 10, 20];
function numOrNull(v){ if(v===''||v===null||v===undefined) return null; const n = parseFloat(v); return isFinite(n) ? Math.round(n*100)/100 : null; }

let pendingTVADoc = null; // {file, raw, isPdf, fields:{...}, alertes:[], userEdited}

async function fileToIAContent(file){
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name||'');
  if(isPdf){
    if(file.size > 5*1024*1024) throw new Error('PDF trop volumineux (max 5 Mo)');
    const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    return { type:'document', media_type:'application/pdf', data: dataUrl.split(',')[1], raw:dataUrl, isPdf:true };
  } else {
    const dataUrl = await compressImageFile(file, 1400, 0.75); // meilleure qualité que la simple photo-justificatif, pour bien lire les montants
    return { type:'image', media_type:'image/jpeg', data: dataUrl.split(',')[1], raw:dataUrl, isPdf:false };
  }
}
function buildTVAPrompt(){
  return `Tu es un assistant comptable pour une TPE française (comptabilité générale). Analyse le justificatif joint (facture, ticket ou reçu) et extrais les informations demandées.

Réponds UNIQUEMENT avec un objet JSON, sans texte autour ni balises markdown, exactement au format :
{"fournisseur":"","siret":"","date":"AAAA-MM-JJ","numero_facture":"","description":"","categorie":"","montant_ht":0,"taux_tva":20,"montant_tva_facture":0,"montant_ttc":0,"tva_deductible":0,"tva_non_deductible":0,"justification":"","source":"","confiance":"elevee","verification_necessaire":false,"alertes":[]}

Règles :
- "montant_tva_facture" = la TVA telle qu'elle apparaît sur le document (peut être 0 si le fournisseur est en franchise de TVA ou si le document n'affiche pas de TVA).
- "tva_deductible" et "tva_non_deductible" : distingue la TVA présente sur le document de la TVA réellement récupérable fiscalement au regard des règles françaises (CGI, BOFiP) — par exemple TVA sur véhicule de tourisme le plus souvent non déductible sauf exception, TVA sur carburant soumise à un taux de déduction partiel selon le carburant et le véhicule, TVA sur cadeaux clients au-delà du seuil légal non déductible, etc. Si tu peux consulter le web, vérifie en priorité sur impots.gouv.fr, bofip.impots.gouv.fr, legifrance.gouv.fr ou service-public.fr et indique l'URL exacte utilisée dans "source".
- "confiance" : "elevee", "moyenne" ou "faible" selon ta certitude sur la règle de déductibilité appliquée.
- "verification_necessaire" : true si "confiance" n'est pas "elevee", ou si le document est ambigu/illisible.
- "alertes" : liste de courtes chaînes signalant les problèmes détectés parmi : montant HT + TVA différent du TTC, taux de TVA incohérent ou absent du barème français (0%, 2.1%, 5.5%, 10%, 20%), document illisible, informations manquantes, ou toute autre anomalie visible.
- Ne jamais inventer une règle fiscale : si tu ne sais pas, mets "confiance":"faible" et explique dans "justification" pourquoi une vérification humaine est nécessaire.
- Les montants sont des nombres (pas de texte, pas de symbole €).`;
}
function detectTVAAnomalies(f){
  const out = [];
  const ht = parseFloat(f.montant_ht), tva = parseFloat(f.montant_tva_facture), ttc = parseFloat(f.montant_ttc);
  if(isFinite(ht) && isFinite(tva) && isFinite(ttc) && Math.abs(ht+tva-ttc) > 0.02) out.push('HT + TVA ≠ TTC');
  const taux = parseFloat(f.taux_tva);
  if(isFinite(taux) && !TVA_TAUX.includes(Math.round(taux*10)/10)) out.push('Taux de TVA hors barème français (0 / 2,1 / 5,5 / 10 / 20 %)');
  if(isFinite(tva) && tva<0) out.push('Montant de TVA négatif');
  if(!isFinite(ht) && !isFinite(ttc)) out.push('Montant HT et TTC manquants');
  if(f.numero_facture){
    const dup = activeTx().find(t=>t.numeroFacture && t.numeroFacture===f.numero_facture && (t.fournisseur||'')===(f.fournisseur||''));
    if(dup) out.push('Facture déjà enregistrée (doublon possible)');
  }
  return out;
}
function normalizeTVAFields(f){
  return {
    fournisseur: f.fournisseur || '',
    siret: f.siret || '',
    date: /^\d{4}-\d{2}-\d{2}/.test(f.date||'') ? f.date.slice(0,10) : new Date().toISOString().slice(0,10),
    numeroFacture: f.numero_facture || '',
    description: f.description || '',
    categorie: f.categorie || '',
    montantHT: numOrNull(f.montant_ht),
    tauxTVA: numOrNull(f.taux_tva),
    montantTVA: numOrNull(f.montant_tva_facture),
    montantTTC: numOrNull(f.montant_ttc),
    tvaDeductible: numOrNull(f.tva_deductible),
    tvaNonDeductible: numOrNull(f.tva_non_deductible),
    iaJustification: f.justification || '',
    iaSource: f.source || '',
    iaConfiance: ['elevee','moyenne','faible'].includes(f.confiance) ? f.confiance : 'faible',
    verificationNecessaire: !!f.verification_necessaire
  };
}
async function analyzeJustificatifIA(file){
  cptToast('🤖 ROOT IA analyse le justificatif…');
  try{
    const content = await fileToIAContent(file);
    const prompt = buildTVAPrompt();
    const text = await callRootIA(prompt, 2000, { file: {type:content.type, media_type:content.media_type, data:content.data}, webSearch:true });
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if(!jsonMatch) throw new Error('Réponse IA non exploitable');
    const f = JSON.parse(jsonMatch[0]);
    const alertes = Array.from(new Set([...(Array.isArray(f.alertes)?f.alertes:[]), ...detectTVAAnomalies(f)]));
    pendingTVADoc = { file, raw: content.raw, isPdf: content.isPdf, fields: normalizeTVAFields(f), alertes, userEdited:false };
    cptToast('Analyse terminée — vérifie les champs avant validation');
  }catch(e){
    console.error('analyzeJustificatifIA', e);
    cptToast('⚠️ Analyse IA indisponible — remplis les champs manuellement');
    let raw = null; try{ raw = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }catch(e2){}
    pendingTVADoc = { file, raw, isPdf: file.type==='application/pdf', fields: normalizeTVAFields({}), alertes:['Analyse automatique indisponible — vérification manuelle nécessaire'], userEdited:false };
  }
  renderCompta();
}
function cancelTVADoc(){ pendingTVADoc = null; renderCompta(); }

    tvaDeductible: type==='depense' ? f.tvaDeductible : null,
    tvaNonDeductible: type==='depense' ? f.tvaNonDeductible : null,

  });

}

window.editTVATx = async (id)=>{
  const t = DATA.transactions.find(t=>t.id===id); if(!t) return;

function tvaExportRows(){

function csvCell(v){ v = String(v==null?'':v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function exportTVACSV(){
  const rows = tvaExportRows();
  const headers = ['Date','Fournisseur/Client','Nature','HT','TVA','TVA déductible','TVA non déductible','TTC','Statut'];
  const csvRows = [headers.join(';')].concat(rows.map(r=>[r.date,r.tiers,r.nature,r.ht,r.tva,r.tvaDeductible,r.tvaNonDeductible,r.ttc,r.statut].map(csvCell).join(';')));
  downloadBlob(new Blob(['\uFEFF'+csvRows.join('\n')], {type:'text/csv;charset=utf-8'}), `sbr-compta-tva-${new Date().toISOString().slice(0,10)}.csv`);
}
function exportTVAXLSX(){
  if(typeof XLSX === 'undefined'){ cptToast('⚠️ Librairie Excel indisponible — utilise le CSV'); return; }
  const rows = tvaExportRows();
  const data = [['Date','Fournisseur/Client','Nature','HT','TVA','TVA déductible','TVA non déductible','TTC','Statut']]
    .concat(rows.map(r=>[r.date,r.tiers,r.nature,r.ht,r.tva,r.tvaDeductible,r.tvaNonDeductible,r.ttc,r.statut]));
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'TVA');
  XLSX.writeFile(wb, `sbr-compta-tva-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function tvaFranchiseStatus(){
  const s = DATA.settings;
  const anneeActuelle = new Date().getFullYear();
  let caVenteAnnee=0, caServiceAnnee=0;
  activeTx().filter(t=>t.type==='recette' && new Date(t.date).getFullYear()===anneeActuelle).forEach(t=>{
    if(isVenteCategorie(t.categorie)) caVenteAnnee+=t.montant; else caServiceAnnee+=t.montant;
  });
  const depasse = caVenteAnnee > s.seuilTVAVente || caServiceAnnee > s.seuilTVAService;
  const pctVente = Math.round(caVenteAnnee/s.seuilTVAVente*100), pctService = Math.round(caServiceAnnee/s.seuilTVAService*100);
  const approche = !depasse && (pctVente>=80 || pctService>=80);
  return {caVenteAnnee, caServiceAnnee, pctVente, pctService, depasse, approche};
}
